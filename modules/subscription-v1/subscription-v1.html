<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>MaxAi · 订阅</title>
<style>
:root{--o:#ff7201;--c:#fff9f3;--p:#fffdfa;--i:#161311;--l:#efddd0;--m:#796f68}*{box-sizing:border-box}html,body{margin:0;background:var(--c);color:var(--i);font-family:"PingFang SC","Microsoft YaHei",Arial,sans-serif}button{font:inherit;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}.app{width:min(100%,402px);height:874px;margin:auto;overflow-y:auto;scrollbar-width:none;background:linear-gradient(180deg,rgba(255,249,243,.14),rgba(255,249,243,.72) 36%,rgba(255,249,243,.96) 73%,#fff9f3),url("../home-v1/assets/hero-sunglasses-v1.png") center/cover no-repeat}.app::-webkit-scrollbar{display:none}.top{height:calc(54px + env(safe-area-inset-top));padding:calc(12px + env(safe-area-inset-top)) 20px 0;display:flex;align-items:flex-start;justify-content:space-between}.top-action{height:30px;padding:0 10px;display:grid;place-items:center;border:1px solid rgba(239,221,208,.95);border-radius:5px;background:rgba(255,255,255,.78);color:#685e57;font-size:12px;backdrop-filter:blur(10px)}.top-action.close{width:30px;padding:0}.top-action svg{width:17px;height:17px}.hero{padding:112px 20px 14px;text-align:center}.hero h1{margin:0;color:#fff;font-size:25px;letter-spacing:-1px;text-shadow:0 2px 12px rgba(30,18,9,.5)}.hero h1 em{font-style:normal;color:var(--o);text-shadow:0 2px 10px rgba(255,255,255,.25)}.hero p{margin:8px 0 0;color:#fff;font-size:12px;text-shadow:0 2px 8px rgba(20,12,7,.64)}.perks{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:15px}.perk{min-height:50px;padding:7px 4px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border:1px solid rgba(255,255,255,.5);border-radius:8px;background:rgba(255,253,251,.78);color:#5e534b;font-size:10px;backdrop-filter:blur(10px)}.perk svg{width:18px;height:18px;color:var(--o)}.benefit-panel{margin:0 20px 12px;padding:12px 13px;border:1px solid rgba(239,221,208,.94);border-radius:10px;background:rgba(255,253,251,.88);backdrop-filter:blur(12px)}.benefit-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.benefit-head strong{font-size:14px;white-space:nowrap}.benefit-head span{color:var(--o);font-size:10px;line-height:1.4;text-align:right}.benefits{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:5px 10px;margin:10px 0 0;padding:0;list-style:none}.benefits li{position:relative;padding-left:10px;color:#6f655e;font-size:10px;line-height:1.45}.benefits li::before{content:"";position:absolute;left:0;top:.52em;width:4px;height:4px;border-radius:50%;background:var(--o)}.plans{margin:0 20px 24px;padding:13px;border:1px solid rgba(239,221,208,.95);border-radius:12px;background:rgba(255,253,251,.93);backdrop-filter:blur(14px)}.plans h2{margin:0 0 10px;font-size:17px}.plan{position:relative;width:100%;min-height:73px;margin-top:8px;padding:11px 12px 10px 39px;border:1px solid #eaded5;border-radius:8px;background:rgba(255,253,251,.92);color:var(--i);text-align:left}.plan::before{content:"";position:absolute;left:13px;top:15px;width:15px;height:15px;border:1.5px solid #9b918a;border-radius:50%}.plan.selected{border-color:var(--o);box-shadow:0 0 0 1px var(--o) inset;background:#fff8f2}.plan.selected::before{border:5px solid var(--o);background:#fff}.plan strong{display:block;font-size:14px}.price{display:block;margin-top:4px;font-size:20px;font-weight:750;letter-spacing:-.4px}.price i{margin-right:4px;color:var(--o);font-style:normal;font-size:11px}.plan small{position:absolute;right:11px;bottom:11px;color:#80756d;font-size:10px}.badge{position:absolute;right:10px;top:9px;padding:3px 6px;border-radius:5px;background:var(--o);color:#fff;font-size:9px}.enterprise .price{font-size:16px}.continue{width:100%;height:44px;margin-top:12px;border-radius:8px;background:var(--o);color:#fff;font-size:15px;font-weight:700}.toast{position:fixed;z-index:20;left:50%;bottom:28px;padding:9px 13px;transform:translate(-50%,12px);border-radius:999px;background:rgba(23,17,13,.86);color:#fff;font-size:12px;opacity:0;pointer-events:none;transition:.2s;white-space:nowrap}.toast.show{transform:translate(-50%,0);opacity:1}@media(prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
<style>
/* 参考图版式：强化方案层级与信息呼吸感 */
.hero{padding-top:96px;padding-bottom:18px}.hero h1{font-size:26px;line-height:1.22}.hero p{font-size:12px;margin-top:9px}.perks{gap:8px;margin-top:18px}.perk{min-height:62px;border-radius:10px;font-size:10px;box-shadow:0 5px 16px rgba(111,67,29,.08)}
.benefit-panel{margin:0 20px 16px;padding:15px 14px 14px;border-left:3px solid var(--o);border-radius:10px;box-shadow:0 7px 18px rgba(111,67,29,.08)}.benefit-head strong{font-size:15px}.benefit-head span{font-size:11px;font-weight:700}.benefits{gap:7px 13px;margin-top:11px}.benefits li{font-size:10px}
.plans{margin:0 20px 24px;padding:16px 14px 14px;border-radius:12px;box-shadow:0 8px 22px rgba(111,67,29,.06)}.plans h2{font-size:19px;margin-bottom:12px}.plan{min-height:96px;margin-top:10px;padding:15px 13px 12px 49px;border-radius:11px}.plan::before{left:15px;top:19px;width:20px;height:20px}.plan.selected{border-width:2px;background:linear-gradient(110deg,#fffaf6,#fff1e4);box-shadow:0 7px 17px rgba(255,114,1,.13)}.plan.selected::before{left:14px;top:18px}.plan strong{font-size:17px}.price{margin-top:8px;font-size:26px}.plan small{margin-top:8px;font-size:14px}.badge{top:12px;right:12px;padding:5px 9px;font-size:10px}.enterprise{min-height:58px;padding-top:12px;padding-bottom:11px}.enterprise .price{font-size:16px;margin-left:8px}.continue{height:52px;margin-top:14px;font-size:18px;box-shadow:0 7px 16px rgba(255,114,1,.2)}
</style>
<link rel="stylesheet" href="../../shared/mobile.css"><script src="../../shared/mobile.js" defer></script></head>
<body><div class="app"><header class="top"><button class="top-action" id="help">帮助</button><button class="top-action close" id="close" aria-label="关闭"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button></header>
<section class="hero"><h1>让每一次创作，更接近<em>爆款</em></h1><p>解锁 AI 电商视频、高清导出与完整创作额度</p><div class="perks" aria-label="核心会员权益"><div class="perk"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="5" width="16" height="14" rx="2"/><path d="m7 16 3.6-4 2.7 2.8 1.8-2 2.9 3.2"/></svg><span>创意电商图片</span></div><div class="perk"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="m10 9 5 3-5 3V9Z"/></svg><span>AI 视频创作</span></div><div class="perk"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3 5 6v5c0 4.5 2.8 7.8 7 10 4.2-2.2 7-5.5 7-10V6l-7-3Z"/><path d="m9 12 2 2 4-4"/></svg><span>高清去水印</span></div></div></section>
<section class="benefit-panel" aria-live="polite"><div class="benefit-head"><strong id="benefitTitle">创作者版权益</strong><span id="benefitCredit">9,000 积分</span></div><ul class="benefits" id="benefits"></ul></section>
<section class="plans"><h2>选择适合你的方案</h2><button class="plan selected" data-plan="creator" data-name="创作者版" data-credit="9000"><span class="badge">首充 5 折</span><strong>创作者版</strong><span class="price"><i>IDR</i>80,000</span><small>9,000 积分</small></button><button class="plan" data-plan="seller" data-name="卖家专业版" data-credit="20000"><strong>卖家专业版</strong><span class="price"><i>IDR</i>175,000</span><small>20,000 积分</small></button><button class="plan" data-plan="agency" data-name="机构版" data-credit="109000"><strong>机构版</strong><span class="price"><i>IDR</i>1,800,000</span><small>109,000 积分</small></button><button class="plan enterprise" data-plan="enterprise" data-name="企业版" data-credit="0"><strong>企业版</strong><span class="price">联系我们</span><small>定制服务</small></button><button class="continue" id="continue">继续</button></section></div><div class="toast" id="toast"></div>
<script>
const q=new URLSearchParams(location.search),back=q.get('return')||'../mine-v1/mine-v1.html';
const common=['创意图片','广告图','电商详情图','广告视频','社媒视频','创意视频','Seedance-2.0','480P、720P、1080P','15s以内','匹配印尼本地风格','去水印'];
const benefitMap={creator:{title:'创作者版权益',credit:'9,000 积分',items:common},seller:{title:'卖家专业版权益',credit:'20,000 积分（19,000 + 赠送 1,000）',items:common},agency:{title:'机构版权益',credit:'109,000 积分（99,000 + 赠送 10,000）',items:[...common,'专属客户经理','AI 广告效果指导']},enterprise:{title:'企业版权益',credit:'199 美金以上套餐或咨询全包代做服务',items:['创意图片','广告图','电商详情图','广告视频','社媒视频','创意视频','Seedance-2.0','480P、720P、1080P','无限制','匹配印尼本地风格','去水印','专属客户经理','AI 广告效果指导','企业安全与隐私','获取全包代做服务权限','专业导演指导']}};
const benefits=document.querySelector('#benefits'),benefitTitle=document.querySelector('#benefitTitle'),benefitCredit=document.querySelector('#benefitCredit'),toast=document.querySelector('#toast');let toastTimer,chosen=document.querySelector('.plan.selected');
function showToast(text){toast.textContent=text;toast.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.classList.remove('show'),1600)}
function renderBenefits(key){const data=benefitMap[key];benefitTitle.textContent=data.title;benefitCredit.textContent=data.credit;benefits.innerHTML=data.items.map(item=>`<li>${item}</li>`).join('')}
document.querySelectorAll('.plan').forEach(plan=>plan.addEventListener('click',()=>{chosen=plan;document.querySelectorAll('.plan').forEach(item=>item.classList.toggle('selected',item===plan));renderBenefits(plan.dataset.plan);document.querySelector('.benefit-panel').scrollIntoView({behavior:'smooth',block:'center'})}));
document.querySelector('#continue').addEventListener('click',()=>{if(chosen.dataset.plan==='enterprise'){showToast('企业定制咨询将在正式版本接入');return}const plan={name:chosen.dataset.name,credit:+chosen.dataset.credit,at:new Date().toISOString()};localStorage.setItem('maxai-subscription',JSON.stringify(plan));localStorage.setItem('maxai-credit',String(plan.credit));const ledger=JSON.parse(localStorage.getItem('maxai-credit-ledger')||'[]');localStorage.setItem('maxai-credit-ledger',JSON.stringify([{title:`订阅 ${plan.name}`,amount:plan.credit,at:plan.at,type:'income'},...ledger]));location.href=back});
document.querySelector('#help').addEventListener('click',()=>showToast('订阅帮助将在正式版本接入'));document.querySelector('#close').addEventListener('click',()=>history.length>1?history.back():location.href=back);renderBenefits('creator');
</script></body></html>
