und:#fff6f5;color:#df4841;font-size:15px}.toast{position:fixed;left:50%;bottom:28px;padding:9px 13px;transform:translate(-50%,12px);border-radius:999px;background:rgba(23,17,13,.86);color:#fff;font-size:12px;opacity:0;transition:.2s;white-space:nowrap}.toast.show{transform:translate(-50%,0);opacity:1}<style>.app{display:flex;flex-direction:column;padding-bottom:0;overflow:hidden}.logout{border-color:#ffc7ad;background:#fff1e7;color:var(--o);font-weight:650}.glyph{color:var(--o)}.glyph svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.bottom-nav{height:68px;padding:6px 16px;display:grid;grid-template-columns:repeat(4,1fr);align-items:center;justify-items:center;border-top:1px solid #efdcd0;background:rgba(255,253,251,.94)}.nav-link{width:100%;min-height:51px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:#8e847d;text-decoration:none;font-size:11px}.nav-link svg{width:27px;height:27px}.nav-surface,.nav-glyph{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.nav-link.active{color:var(--o)}.nav-link.active .nav-surface{fill:var(--o);stroke:var(--o)}.nav-link.active .nav-glyph{stroke:#fff}</style></head><body><main class="app"><header class="top"><button class="back" id="back" aria-label="返回"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></button></header><section class="group"><button class="row" data-subscription><span class="glyph"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" rx="2"/><path d="M7 9h10M7 13h6"/></svg></span><span class="copy"><b>订阅与发票</b><small id="subStatus">未订阅</small></span><span class="chev">›</span></button><button class="row" data-subscription><span class="glyph"><svg viewBox="0 0 24 24"><path d="M12 3 5 6v5c0 4.5 2.8 7.8 7 10 4.2-2.2 7-5.5 7-10V6l-7-3Z ="row" data-toast="学习手册将在后续接入"><span class="glyph"></span><span class="copy"><b>学习手册</b></span><span class="chev">›</span></button></section><button class="logout" id="logout">退出登录</button><nav class="bottom-nav" aria-label="主导航"><a class="nav-link" href="../home-v1/home-v1.html"><svg viewBox="0 0 28 28"><rect class="nav-surface" x="3.5" y="4.2" width="21" height="20" rx="6.3"/><path class="nav-glyph" d="M8.5 17.7v-7.1l5.5 4.5 5.5-4.5v7.1"/></svg><span>首页</span></a><a class="nav-link" href="../create-v1/create-v1.html"><svg viewBox="0 0 28 28"><rect class="nav-surface" x="3.5" y="3.5" width="21" height="21" rx="7"/><path class="nav-glyph" d="M14 7.4c.55 3.8 2.35 5.6 6.2 6.2-3.85.6-5.65 2.4-6.2 6.2-.55-3.8-2.35-5.6-6.2-6.2 3.85-.6 5.65-2.4 6.2-6.2Z"/></svg><span>创作</span></a><a class="nav-link" href="../assets-v1/assets-v1.html"><svg viewBox="0 0 28 28"><rect class="nav-surface" x="3.5" y="3.5" width="21" height="21" rx="7"/><path class="nav-glyph" d="M8.25 10.25h11.5v8H8.25zM10.2 10.25V8.8h4.95l1.4 1.45M11.1 13.1h5.8M11.1 15.55h3.5"/></svg><span>资产</span></a><a class="nav-link active" href="../mine-v1/mine-v1.html"><svg viewBox="0 0 28 28"><rect class="nav-surface" x="3.5" y="3.5" width="21" height="21" rx="7"/><circle class="nav-glyph" cx="14" cy="10" r="3.05"/><path class="nav-glyph" d="M8.35 20.05c.48-3.25 2.35-4.9 5.65-4.9s5.17 1.65 5.65 4.9"/></svg><span>我的</span></a></nav></main><div class="toast" id="toast"></div><script>const toast=document.querySelector('#toast');let t;const note=x=>{toast.textContent=x;toast.classList.add('show');clearTimeout(t);t=setTimeout(()=>toast.classList.remove('show'),1600)};const s=(()=>{try{return JSON.parse(localStorage.getItem('maxai-subscription')||'null')}catch(e){return null}})();document.querySelector('#subStatus').textContent=s?`已订阅：${s.name}`:'未订阅';document.querySelector('#back').onclick=()=>history.back();document.querySelectorAll('[data-subscription]').forEach(b=>b.onclick=()=>location.href='../subscription-v1/subscript
