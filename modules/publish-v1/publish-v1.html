<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#fff9f3" />
  <title>MaxAi · 发布作品</title>
  <style>
    :root{--orange:#ff7201;--ink:#161311;--cream:#fff9f3;--paper:#fffdfa;--line:#efddd0;--muted:#8d8178}*{box-sizing:border-box}html,body{margin:0;background:var(--cream);color:var(--ink);font-family:"PingFang SC","Microsoft YaHei",Arial,sans-serif}button,input{font:inherit}button{border:0;cursor:pointer}.app{width:min(100%,402px);height:874px;min-height:874px;margin:0 auto;display:flex;flex-direction:column;overflow:hidden;background:var(--cream)}.top{height:calc(58px + env(safe-area-inset-top));padding:env(safe-area-inset-top) 20px 0;display:grid;grid-template-columns:30px 1fr 30px;align-items:center}.back{width:30px;height:30px;display:grid;place-items:center;border:1px solid #edddd2;border-radius:5px;background:rgba(255,255,255,.64);color:#695f58}.back svg{width:17px;height:17px}.top h1{margin:0;text-align:center;font-size:18px}.content{flex:1;min-height:0;overflow:auto;padding:10px 20px calc(24px + env(safe-area-inset-bottom));scrollbar-width:none}.content::-webkit-scrollbar{display:none}.intro{margin:0 0 18px;color:var(--muted);font-size:13px;line-height:1.55}.form-card{padding:15px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.64)}.field{margin-top:20px}.field:first-child{margin-top:0}.field-label{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px;font-size:14px;font-weight:650}.field-label small{color:var(--muted);font-size:11px;font-weight:400}.kind{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:999px;background:#fff0e4;color:var(--orange);font-size:12px;font-weight:650}.category-list{display:flex;flex-wrap:wrap;gap:8px}.category{height:32px;padding:0 12px;border:1px solid #eaded5;border-radius:999px;background:#fffdfa;color:#685e57;font-size:12px}.category.active{border-color:var(--orange);background:var(--orange);color:#fff}.title-input{width:100%;height:44px;padding:0 12px;border:1px solid #eaded5;border-radius:6px;outline:none;background:#fffdfa;color:var(--ink);font-size:16px}.title-input:focus{border-color:var(--orange);box-shadow:0 0 0 3px rgba(255,114,1,.12)}.cover-row{display:flex;gap:12px;align-items:center}.cover{position:relative;width:94px;height:118px;overflow:hidden;border-radius:8px;background:#eadbd0}.cover img{display:block;width:100%;height:100%;object-fit:cover}.cover.video::after{content:"视频首帧";position:absolute;right:6px;bottom:6px;padding:3px 5px;border-radius:4px;background:rgba(0,0,0,.48);color:#fff;font-size:9px}.cover-copy{flex:1;min-width:0}.cover-copy p{margin:0;color:var(--muted);font-size:12px;line-height:1.55}.cover-select{height:32px;margin-top:10px;padding:0 11px;border:1px solid #ffd0aa;border-radius:6px;background:#fff3e8;color:var(--orange);font-size:12px}.publish{width:100%;height:46px;margin-top:22px;border-radius:8px;background:var(--orange);color:#fff;font-size:16px;font-weight:700;box-shadow:0 8px 16px rgba(255,114,1,.22)}.publish:disabled{background:#e7d8cc;box-shadow:none;color:#a99e96}.toast{position:absolute;z-index:10;left:50%;bottom:24px;padding:9px 13px;transform:translate(-50%,14px);border-radius:999px;background:rgba(23,17,13,.86);color:#fff;font-size:12px;opacity:0;pointer-events:none;transition:.2s ease;white-space:nowrap}.toast.show{transform:translate(-50%,0);opacity:1}.empty{padding:48px 16px;text-align:center;color:var(--muted)}
  </style>
</head>
<body><div class="app"><header class="top"><button class="back" id="back" aria-label="返回"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></button><h1>发布作品</h1><span></span></header><main class="content" id="content"></main><div class="toast" id="toast"></div></div>
<script>
  if(localStorage.getItem('maxai-auth')!=='1'){location.replace('../login-v1/login-v1.html?return='+encodeURIComponent(location.href))}
  const content=document.querySelector('#content'),toast=document.querySelector('#toast'),query=new URLSearchParams(location.search),creationId=query.get('creation');let timer,creation,category='',coverSrc='';
  const read=(key)=>{try{return JSON.parse(localStorage.getItem(key)||'[]')}catch(error){return []}},write=(key,value)=>localStorage.setItem(key,JSON.stringify(value));
  creation=read('maxai-creation-history').find(item=>item.id===creationId&&item.status==='complete'&&item.origin==='original');
  const escapeHTML=value=>{const el=document.createElement('div');el.textContent=value||'';return el.innerHTML};
  const showToast=text=>{toast.textContent=text;toast.classList.add('show');clearTimeout(timer);timer=setTimeout(()=>toast.classList.remove('show'),1600)};
  if(!creation){content.innerHTML='<section class="empty">仅从空白创作页开始完成的原创作品可以发布为模板。</section>'}else{
    coverSrc=creation.asset;const kind=creation.type==='video'?'视频模板':'图片模板';const categories=['热门推荐','产品宣传','美肤电商','服装展示','社媒带货','灵感上新'];
    content.innerHTML=`<p class="intro">发布后，这份作品将作为 ${kind} 出现在首页与模板库，也会同步到你的作品栏。</p><section class="form-card"><div class="field"><div class="field-label"><span>模板类型</span><span class="kind">${kind}</span></div></div><div class="field"><div class="field-label"><span>模板分类</span><small>请选择 1 项</small></div><div class="category-list">${categories.map(name=>`<button class="category" data-category="${name}">${name}</button>`).join('')}</div></div><div class="field"><label class="field-label" for="title"><span>作品标题</span><small>最多 24 字</small></label><input class="title-input" id="title" maxlength="24" placeholder="为模板取一个易识别的标题" value="${escapeHTML(creation.assetName||'我的作品')}"></div><div class="field"><div class="field-label"><span>缩略图</span><small>不选择则使用首帧</small></div><div class="cover-row"><div class="cover ${creation.type==='video'?'video':''}" id="cover"><img src="${creation.asset}" alt="作品缩略图"></div><div class="cover-copy"><p>默认使用当前作品的${creation.type==='video'?'视频首帧':'原图'}作为模板封面，也可以换成更具代表性的画面。</p><button class="cover-select" id="selectCover">选择缩略图</button><input id="coverInput" type="file" accept="image/*" hidden></div></div></div><button class="publish" id="publish">发布模板</button></section>`;
    document.querySelectorAll('[data-category]').forEach(button=>button.addEventListener('click',()=>{category=button.dataset.category;document.querySelectorAll('[data-category]').forEach(item=>item.classList.toggle('active',item===button))}));
    document.querySelector('#selectCover').addEventListener('click',()=>document.querySelector('#coverInput').click());
    document.querySelector('#coverInput').addEventListener('change',event=>{const file=event.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{coverSrc=reader.result;document.querySelector('#cover img').src=coverSrc;showToast('已更新缩略图')};reader.readAsDataURL(file)});
    document.querySelector('#publish').addEventListener('click',()=>{const title=document.querySelector('#title').value.trim();if(!category){showToast('请选择模板分类');return}if(!title){showToast('请填写作品标题');return}const published=read('maxai-published-works'),existing=published.find(item=>item.creationId===creation.id);const work={id:existing?.id||`published-${Date.now()}`,creationId:creation.id,type:creation.type,category,title,asset:coverSrc,prompt:creation.prompt,model:creation.model,likes:existing?.likes||0,publishedAt:new Date().toISOString()};write('maxai-published-works',[work,...published.filter(item=>item.creationId!==creation.id)]);write('maxai-template-feed',[work,...read('maxai-template-feed').filter(item=>item.creationId!==creation.id)]);showToast('发布成功，已同步到作品与模板库');setTimeout(()=>location.href='../mine-v1/mine-v1.html',650)});
  }
  document.querySelector('#back').addEventListener('click',()=>history.length>1?history.back():location.href='../assets-v1/assets-v1.html');
</script></body></html>
