<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>MaxAi · 积分明细</title><style>:root{--o:#ff7201;--c:#fff9f3;--i:#161311;--l:#efddd0}*{box-sizing:border-box}html,body{margin:0;background:var(--c);font-family:"PingFang SC","Microsoft YaHei",Arial;color:var(--i)}.app{width:min(100%,402px);height:874px;margin:auto;padding:calc(14px + env(safe-area-inset-top)) 20px;overflow:auto}.top{display:grid;grid-template-columns:30px 1fr 30px;align-items:center}.back{width:30px;height:30px;border:1px solid var(--l);border-radius:5px;background:#fffdfa;font-size:21px}.top h1{text-align:center;margin:0;font-size:18px}.balance{margin:22px 0 18px;padding:18px;border:1px solid #f0daca;border-radius:12px;background:#fffdfa}.balance span{color:#82766e;font-size:12px}.balance strong{display:block;margin-top:5px;color:var(--o);font-size:31px}.item{display:flex;justify-content:space-between;padding:14px 2px;border-bottom:1px solid var(--l)}.item b{font-size:14px}.item small{display:block;margin-top:5px;color:#968a82;font-size:11px}.income{color:var(--o)}.out{color:#756961}</style></head><body><main class="app"><header class="top"><button class="back" id="back">‹</button><h1>积分明细</h1><span></span></header><section class="balance"><span>当前可用积分</span><strong id="balance">0</strong></section><section id="list"></section></main><script>const read=k=>{try{return JSON.parse(localStorage.getItem(k)||'[]')}catch(e){return[]}},n=+localStorage.getItem('maxai-credit')||0;document.querySelector('#balance').textContent=n.toLocaleString();const l=read('maxai-credit-ledger');document.querySelector('#list').innerHTML=l.length?l.map(x=>`<article class="item"><div><b>${x.title}</b><small>${new Date(x.at).toLocaleString()}</small></div><b class="${x.amount>0?'income':'out'}">${x.amount>0?'+':''}${x.amount}</b></article>`).join(''):'<p style="color:#93877e;text-align:center;padding:40px 0">暂无积分记录</p>';document.querySelector('#back').onclick=()=>history.back()</script></body></html>
