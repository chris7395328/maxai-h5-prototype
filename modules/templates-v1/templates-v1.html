<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#fff9f3" />
  <title>MaxAi · 创意模板</title>
  <style>
    :root{--orange:#ff7201;--ink:#161311;--cream:#fff9f3;--line:#efddd0;--muted:#93877e}*{box-sizing:border-box}html,body{margin:0;background:var(--cream);color:var(--ink);font-family:"PingFang SC","Microsoft YaHei",Arial,sans-serif}button,a{font:inherit;-webkit-tap-highlight-color:transparent}button{border:0;cursor:pointer}.app{width:min(100%,430px);min-height:100dvh;margin:0 auto;background:var(--cream)}.top{height:calc(116px + env(safe-area-inset-top));padding:env(safe-area-inset-top) 20px 0;display:grid;grid-template-columns:44px 1fr 44px;align-items:center}.back{width:44px;height:44px;display:grid;place-items:center;border:1px solid #eee1d8;border-radius:50%;background:rgba(255,255,255,.55);color:#28211d}.back svg{width:25px;height:25px}.top h1{margin:0;text-align:center;font-size:22px;letter-spacing:-.6px}.intro{padding:0 20px 18px;text-align:center;color:#958a82;font-size:13px}.tags{display:flex;gap:9px;overflow-x:auto;padding:0 20px 18px;scrollbar-width:none}.tags::-webkit-scrollbar{display:none}.tag{height:35px;padding:0 17px;border:1px solid #eee4de;border-radius:999px;background:#fffdfb;color:#655c57;font-size:13px;white-space:nowrap}.tag.active{border-color:var(--orange);background:var(--orange);color:#fff}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding:0 20px 30px}.template-card{position:relative;aspect-ratio:.665;overflow:hidden;border-radius:18px;background:#e8d9cf;color:#fff;text-decoration:none;box-shadow:0 4px 13px rgba(109,68,35,.08)}.template-card img{width:100%;height:100%;object-fit:cover;transition:transform .25s ease}.template-card::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 47%,rgba(0,0,0,.66))}.template-card:hover img{transform:scale(1.03)}.card-tag{position:absolute;z-index:1;top:9px;left:9px;padding:4px 8px;border-radius:999px;background:rgba(255,255,255,.76);color:#4d423a;font-size:10px}.card-name{position:absolute;z-index:1;right:11px;bottom:11px;left:11px;font-size:18px;font-weight:700;letter-spacing:-.3px}.empty{display:none;padding:50px 0;text-align:center;color:var(--muted)}.toast{position:fixed;z-index:20;left:50%;bottom:28px;padding:9px 13px;transform:translate(-50%,16px);border-radius:999px;background:rgba(23,17,13,.84);color:#fff;font-size:12px;opacity:0;pointer-events:none;transition:.2s ease;white-space:nowrap}.toast.show{transform:translate(-50%,0);opacity:1}@media(min-width:431px){.app{box-shadow:0 0 0 1px rgba(160,104,58,.09),0 18px 55px rgba(73,42,16,.15)}}
  </style>
  <style>
    /* iPhone 17 portrait prototype canvas: 402 × 874 CSS px */
    .app{width:min(100%,402px);height:874px;min-height:874px;display:flex;flex-direction:column;overflow:hidden}.app>main{flex:1 1 auto;min-height:0;overflow-y:auto;scrollbar-width:none;padding-bottom:24px}.app>main::-webkit-scrollbar{display:none}.bottom-nav{position:relative;z-index:20;bottom:auto;left:auto;width:100%;height:calc(64px + env(safe-area-inset-bottom));padding:5px 12px env(safe-area-inset-bottom);display:grid;grid-template-columns:repeat(4,1fr);flex:0 0 auto;transform:none;border-top:1px solid #efdcd0;background:rgba(255,253,251,.94);box-shadow:0 -8px 20px rgba(112,67,28,.07);backdrop-filter:blur(16px)}.nav-link{min-height:51px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:#8e847d;text-decoration:none;font-size:11px}.nav-link svg{width:27px;height:27px;overflow:visible}.nav-surface,.nav-glyph{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.nav-link.active{color:var(--orange);font-weight:600}.nav-link.active .nav-surface{fill:var(--orange);stroke:var(--orange)}.nav-link.active .nav-glyph{stroke:#fff}
  </style>
  <style>.bottom-nav{height:calc(68px + env(safe-area-inset-bottom));padding:6px 16px calc(7px + env(safe-area-inset-bottom));align-items:center;justify-items:center}.nav-link{width:100%;min-height:51px}</style>
  <style>
    /* 统一圆角：Banner 12px 为最大常规圆角。 */
    .back{border-radius:5px}.template-card{border-radius:9px}
  </style>
  <style>
    /* 模板总览使用固定的 iPhone 17 页面分区，避免旧版自由高度与栅格互相挤压。 */
    html,body{height:100%;overflow:hidden}.app{width:min(100%,402px);height:874px;min-height:874px;display:flex;flex-direction:column;overflow:hidden}.top{height:calc(58px + env(safe-area-inset-top));padding:env(safe-area-inset-top) 20px 0;grid-template-columns:30px 1fr 30px;flex:0 0 auto}.back{width:30px;height:30px}.back svg{width:17px;height:17px}.top h1{font-size:18px}.intro{flex:0 0 auto;padding:2px 20px 12px;font-size:12px}.tags{flex:0 0 auto;gap:8px;padding:0 20px 13px}.tag{height:32px;padding:0 14px;font-size:12px}.grid,.app>main.grid{width:100%;min-width:0;min-height:0;flex:1 1 auto;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:max-content;align-content:start;gap:12px;padding:0 20px 24px;overflow-x:hidden;overflow-y:auto;scrollbar-width:none}.grid::-webkit-scrollbar{display:none}.template-card{display:block;width:100%;min-width:0;aspect-ratio:9/14}.template-card[hidden]{display:none}.card-name{right:10px;bottom:10px;left:10px;font-size:15px}.bottom-nav{position:relative;inset:auto;width:100%;height:calc(68px + env(safe-area-inset-bottom));padding:6px 16px calc(7px + env(safe-area-inset-bottom));flex:0 0 auto;transform:none}.empty{flex:1 1 auto;margin:0}
  </style>
</head>
<body>
  <div class="app">
    <header class="top"><button class="back" type="button" id="back" aria-label="返回"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m14.5 5-7 7 7 7"/></svg></button><h1>创意模板</h1><span></span></header>
    <p class="intro">发现适合商品与品牌内容的热门模板</p>
    <nav class="tags" aria-label="模板分类"><button class="tag active" data-category="全部">全部</button><button class="tag" data-category="热门推荐">热门推荐</button><button class="tag" data-category="美肤电商">美肤电商</button><button class="tag" data-category="食品饮料">食品饮料</button><button class="tag" data-category="服饰穿搭">服饰穿搭</button><button class="tag" data-category="家居生活">家居生活</button></nav>
    <main class="grid" id="grid"><a class="template-card" href="../template-detail-v1/template-detail-v1.html?template=perfume" data-category="热门推荐"><img src="../home-v1/assets/hero-perfume-v1.png" alt="香氛质感"><span class="card-tag">热门推荐</span><strong class="card-name">香氛质感</strong></a><a class="template-card" href="../template-detail-v1/template-detail-v1.html?template=serum" data-category="美肤电商"><img src="../home-v1/assets/hero-serum-v1.png" alt="焕亮精华"><span class="card-tag">美肤电商</span><strong class="card-name">焕亮精华</strong></a><a class="template-card" href="../template-detail-v1/template-detail-v1.html?template=sunglasses" data-category="热门推荐"><img src="../home-v1/assets/hero-sunglasses-v1.png" alt="夏日眼镜"><span class="card-tag">热门推荐</span><strong class="card-name">夏日眼镜</strong></a><a class="template-card" href="../template-detail-v1/template-detail-v1.html?template=luxury" data-category="服饰穿搭"><img src="../home-v1/assets/hero-perfume-v1.png" alt="轻奢新品"><span class="card-tag">服饰穿搭</span><strong class="card-name">轻奢新品</strong></a><a class="template-card" href="../template-detail-v1/template-detail-v1.html?template=holiday" data-category="家居生活"><img src="../home-v1/assets/hero-sunglasses-v1.png" alt="度假氛围"><span class="card-tag">家居生活</span><strong class="card-name">度假氛围</strong></a></main><p class="empty" id="empty">暂无该分类模板</p>
    <nav class="bottom-nav" aria-label="主导航"><a class="nav-link active" href="../home-v1/home-v1.html"><svg viewBox="0 0 28 28"><rect class="nav-surface" x="3.5" y="4.2" width="21" height="20" rx="6.3"/><path class="nav-glyph" d="M8.5 17.7v-7.1l5.5 4.5 5.5-4.5v7.1"/></svg><span>首页</span></a><a class="nav-link" href="../create-v1/create-v1.html"><svg viewBox="0 0 28 28"><rect class="nav-surface" x="3.5" y="3.5" width="21" height="21" rx="7"/><path class="nav-glyph" d="M14 7.4c.55 3.8 2.35 5.6 6.2 6.2-3.85.6-5.65 2.4-6.2 6.2-.55-3.8-2.35-5.6-6.2-6.2 3.85-.6 5.65-2.4 6.2-6.2Z"/></svg><span>创作</span></a><a class="nav-link" href="../assets-v1/assets-v1.html"><svg viewBox="0 0 28 28"><rect class="nav-surface" x="3.5" y="3.5" width="21" height="21" rx="7"/><path class="nav-glyph" d="M8.25 10.25h11.5v8H8.25zM10.2 10.25V8.8h4.95l1.4 1.45M11.1 13.1h5.8M11.1 15.55h3.5"/></svg><span>资产</span></a><a class="nav-link" href="../mine-v1/mine-v1.html"><svg viewBox="0 0 28 28"><rect class="nav-surface" x="3.5" y="3.5" width="21" height="21" rx="7"/><circle class="nav-glyph" cx="14" cy="10" r="3.05"/><path class="nav-glyph" d="M8.35 20.05c.48-3.25 2.35-4.9 5.65-4.9s5.17 1.65 5.65 4.9"/></svg><span>我的</span></a></nav><div class="toast" role="status" aria-live="polite"></div>
  </div>
  <script>
    const tags=[...document.querySelectorAll('.tag')],cards=[...document.querySelectorAll('.template-card')],empty=document.querySelector('#empty'),toast=document.querySelector('.toast');let timer;
    function showToast(text){toast.textContent=text;toast.classList.add('show');clearTimeout(timer);timer=setTimeout(()=>toast.classList.remove('show'),1800)}
    tags.forEach(tag=>tag.addEventListener('click',()=>{tags.forEach(item=>item.classList.toggle('active',item===tag));let count=0;cards.forEach(card=>{const show=tag.dataset.category==='全部'||card.dataset.category===tag.dataset.category;card.hidden=!show;if(show)count++});empty.style.display=count?'none':'block'}));
    document.querySelector('#back').addEventListener('click',()=>history.length>1?history.back():location.href='../create-v1/create-v1.html');
  </script>
  <script>
    (()=>{
      const grid=document.querySelector('#grid');
      const read=()=>{try{return JSON.parse(localStorage.getItem('maxai-published-works')||'[]')}catch(error){return []}};
      function renderPublished(){
        grid.querySelectorAll('.published-card').forEach(card=>card.remove());
        read().forEach(work=>grid.insertAdjacentHTML('afterbegin',`<a class="template-card published-card" href="../template-detail-v1/template-detail-v1.html?published=${encodeURIComponent(work.id)}" data-category="${work.category}"><img src="${work.asset}" alt="${work.title}"><span class="card-tag">${work.category}</span><strong class="card-name">${work.title}</strong></a>`));
      }
      renderPublished();
      document.querySelectorAll('.tag').forEach(tag=>tag.addEventListener('click',()=>setTimeout(()=>{const category=document.querySelector('.tag.active')?.dataset.category||'全部';grid.querySelectorAll('.published-card').forEach(card=>card.hidden=category!=='全部'&&card.dataset.category!==category)},0)));
      window.addEventListener('storage',event=>{if(event.key==='maxai-published-works')renderPublished()});
      document.addEventListener('visibilitychange',()=>{if(!document.hidden)renderPublished()});
    })();
  </script>
</body>
</html>
