<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#17120f" />
  <title>登录 MaxAi</title>
  <style>
    :root{--orange:#ff7201;--ink:#161311;--cream:#fff9f3}*{box-sizing:border-box}html,body{margin:0;background:#17120f;color:#fff;font-family:"PingFang SC","Microsoft YaHei",Arial,sans-serif}button{font:inherit;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}.app{position:relative;width:min(100%,402px);height:874px;min-height:874px;margin:0 auto;overflow:hidden;background:#17120f;isolation:isolate}.cover-stage{position:absolute;inset:-105px -92px;display:flex;gap:12px;transform:rotate(-11deg) scale(1.08);transform-origin:center}.cover-column{width:154px;display:flex;flex-direction:column;gap:12px;animation:scroll-up 16s linear infinite}.cover-column:nth-child(2){animation-name:scroll-down;animation-duration:19s}.cover-column:nth-child(3){animation-duration:17s}.cover-column img{width:154px;height:224px;object-fit:cover;border-radius:16px;filter:saturate(.86)}.cover-shade{position:absolute;z-index:1;inset:0;background:linear-gradient(180deg,rgba(15,9,5,.55),rgba(15,9,5,.72) 47%,rgba(15,9,5,.94));}.top{position:absolute;z-index:2;top:0;right:0;left:0;height:calc(66px + env(safe-area-inset-top));padding:env(safe-area-inset-top) 20px 0;display:flex;align-items:center;justify-content:space-between}.close,.home{width:34px;height:34px;display:grid;place-items:center;border:1px solid rgba(255,255,255,.68);border-radius:12px;background:rgba(20,12,7,.22);color:#fff}.close svg,.home svg{width:19px;height:19px}.content{position:absolute;z-index:2;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:0 20px calc(25px + env(safe-area-inset-bottom));text-align:center}.brand{display:flex;align-items:center;gap:8px;margin-bottom:22px}.brand img{width:28px;height:28px}.brand span{font-family:"Arial Black","PingFang SC","Microsoft YaHei",sans-serif;font-size:28px;line-height:1;letter-spacing:-1.35px}.content h1{max-width:350px;margin:0;font-size:31px;line-height:1.23;letter-spacing:-1.2px}.content p{margin:13px 0 0;color:rgba(255,255,255,.88);font-size:15px}.free{margin:0 0 20px;color:var(--orange);font-size:15px;font-weight:750}.free svg{width:20px;height:14px;margin-left:4px;vertical-align:-2px}.login-actions{width:100%;display:grid;gap:9px}.login{height:54px;display:flex;align-items:center;justify-content:center;gap:10px;border-radius:17px;background:#fff;color:#201a16;font-size:17px;font-weight:700}.login.google svg{width:21px;height:21px}.login.apple{background:rgba(255,255,255,.96)}.login.apple svg{width:22px;height:22px}.login.email{border:1px solid rgba(255,255,255,.68);background:rgba(28,17,9,.28);color:#fff}.login.email svg{width:23px;height:23px}.legal{margin:17px 8px 0;color:rgba(255,255,255,.62);font-size:11px;line-height:1.55}.legal em{color:#ffb06e;font-style:normal}@keyframes scroll-up{from{transform:translateY(0)}to{transform:translateY(-472px)}}@keyframes scroll-down{from{transform:translateY(-472px)}to{transform:translateY(0)}}@media(min-width:431px){.app{box-shadow:0 0 0 1px rgba(255,255,255,.1),0 18px 55px rgba(0,0,0,.35)}}@media(prefers-reduced-motion:reduce){.cover-column{animation:none}}
  </style>
  <style>
    /* 统一圆角：Banner 12px 为最大常规圆角。 */
    .cover-column img{border-radius:8px}.close,.home{border-radius:5px}.login{border-radius:9px}
  </style>
  <style>
    /* 大尺寸、带留白的斜向横向封面墙。 */
    .cover-stage{inset:-150px -350px;display:grid;grid-template-rows:repeat(3,292px);gap:14px;transform:rotate(-11deg) scale(1.12)}.cover-column{width:max-content;display:flex;flex-direction:row;gap:14px;animation:login-row-left 20s linear infinite}.cover-column:nth-child(2){animation-name:login-row-right;animation-duration:23s}.cover-column:nth-child(3){animation-duration:21s}.cover-column img{width:200px;height:292px;border-radius:8px}.cover-shade{background:linear-gradient(180deg,rgba(15,9,5,.5),rgba(15,9,5,.63) 46%,rgba(15,9,5,.93))}.brand{margin:calc(318px + env(safe-area-inset-top)) 0 18px}.content h1{font-size:30px}.content p{margin-top:11px}.legal{margin-top:14px;font-size:9px;line-height:1.42}@keyframes login-row-left{from{transform:translateX(0)}to{transform:translateX(-428px)}}@keyframes login-row-right{from{transform:translateX(-428px)}to{transform:translateX(0)}}
  </style>
</head>
<body>
  <main class="app">
    <div class="cover-stage" aria-hidden="true"><div class="cover-column"><img src="../home-v1/assets/hero-perfume-v1.png" alt=""><img src="../home-v1/assets/hero-serum-v1.png" alt=""><img src="../home-v1/assets/hero-sunglasses-v1.png" alt=""><img src="../home-v1/assets/hero-perfume-v1.png" alt=""><img src="../home-v1/assets/hero-serum-v1.png" alt=""></div><div class="cover-column"><img src="../home-v1/assets/hero-sunglasses-v1.png" alt=""><img src="../home-v1/assets/hero-perfume-v1.png" alt=""><img src="../home-v1/assets/hero-serum-v1.png" alt=""><img src="../home-v1/assets/hero-sunglasses-v1.png" alt=""><img src="../home-v1/assets/hero-perfume-v1.png" alt=""></div><div class="cover-column"><img src="../home-v1/assets/hero-serum-v1.png" alt=""><img src="../home-v1/assets/hero-sunglasses-v1.png" alt=""><img src="../home-v1/assets/hero-perfume-v1.png" alt=""><img src="../home-v1/assets/hero-serum-v1.png" alt=""><img src="../home-v1/assets/hero-sunglasses-v1.png" alt=""></div></div><div class="cover-shade"></div>
    <header class="top"><button class="close" id="close" aria-label="关闭"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 6 12 12M18 6 6 18"/></svg></button><button class="home" id="home" aria-label="回到首页"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m4 10 8-6 8 6v9H4v-9Z"/><path d="M9 19v-5h6v5"/></svg></button></header>
    <section class="content"><div class="brand"><img src="../home-v1/assets/maxai-logo.svg" alt=""><span>MaxAi</span></div><h1>让每件商品，都有大片感</h1><p>AI 一键生成电商视频，灵感即刻上线</p><div style="flex:1"></div><div class="free">免费开始创作 <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M3 12h17M15 6l6 6-6 6"/></svg></div><div class="login-actions"><button class="login google" id="googleLogin"><svg viewBox="0 0 24 24" viewBox="0 0 24 24"><path fill="#4285F4" d="M21.35 12.22c0-.71-.06-1.39-.18-2.05H12v3.88h5.24a4.48 4.48 0 0 1-1.94 2.94v2.52h3.14c1.84-1.69 2.91-4.18 2.91-7.29Z"/><path fill="#34A853" d="M12 21.72c2.63 0 4.84-.87 6.44-2.35l-3.14-2.52c-.87.58-1.99.92-3.3.92-2.54 0-4.69-1.71-5.46-4.01H3.3v2.6A9.73 9.73 0 0 0 12 21.72Z"/><path fill="#FBBC05" d="M6.54 13.76A5.85 5.85 0 0 1 6.24 12c0-.61.1-1.2.3-1.76v-2.6H3.3A9.72 9.72 0 0 0 2.28 12c0 1.57.38 3.06 1.02 4.36l3.24-2.6Z"/><path fill="#EA4335" d="M12 6.23c1.43 0 2.71.49 3.72 1.46l2.79-2.79C16.84 3.34 14.63 2.28 12 2.28A9.73 9.73 0 0 0 3.3 7.64l3.24 2.6C7.31 7.94 9.46 6.23 12 6.23Z"/></svg>使用 Google 继续</button><button class="login apple" data-note="Apple 登录将在正式版接入"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M16.7 12.8c0-2.4 2-3.6 2.1-3.7-1.1-1.7-2.9-1.9-3.5-2-1.5-.2-2.9.9-3.7.9-.8 0-2-.9-3.3-.8-1.7 0-3.2 1-4.1 2.4-1.8 3.2-.5 7.9 1.3 10.5.9 1.3 1.9 2.8 3.3 2.7 1.3-.1 1.9-.8 3.5-.8 1.6 0 2.1.8 3.5.8 1.5 0 2.4-1.3 3.3-2.6 1-1.5 1.5-3 1.5-3.1-.1 0-2.9-1.1-2.9-4.2ZM14.3 5.4c.7-.9 1.1-2.1 1-3.4-1.1 0-2.4.7-3.2 1.6-.7.8-1.2 2-1.1 3.3 1.2.1 2.5-.6 3.3-1.5Z"/></svg>使用 Apple 继续</button><button class="login email" data-note="邮箱登录将在正式版接入"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="m4 8 8 6 8-6"/></svg>使用电子邮箱继续</button></div><p class="legal">继续操作即表示您已阅读并同意我们的<em>用户协议</em>和<em>隐私政策</em>。</p></section>
  </main>
  <script>
    const fallback='../home-v1/home-v1.html',returnTo=new URLSearchParams(location.search).get('return');function safeTarget(){return returnTo&&returnTo.startsWith('file:')?returnTo:'../mine-v1/mine-v1.html'}document.querySelector('#googleLogin').addEventListener('click',()=>{try{localStorage.setItem('maxai-auth','1')}catch(error){}location.href=safeTarget()});document.querySelector('#close').addEventListener('click',()=>history.length>1?history.back():location.href=fallback);document.querySelector('#home').addEventListener('click',()=>location.href=fallback);document.querySelectorAll('[data-note]').forEach(button=>button.addEventListener('click',()=>alert(button.dataset.note)));
  </script>
</body>
</html>
