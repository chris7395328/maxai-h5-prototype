  <style>
    :root{--orange:#ff7201;--ink:#161311;--cream:#fff9f3;--paper:#fffdfb;--line:#efddd0;--muted:#8f837a}*{box-sizing:border-box}html,body{margin:0;background:var(--cream);color:var(--ink);font-family:"PingFang SC","Microsoft YaHei",Arial,sans-serif}button,a{font:inherit;-webkit-tap-highlight-color:transparent}button{border:0;cursor:pointer}.app{width:min(100%,430px);min-height:100dvh;margin:auto;padding-bottom:calc(30px + env(safe-area-inset-bottom));background:var(--cream)}.top{height:calc(67px + env(safe-area-inset-top));padding:env(safe-area-inset-top) 20px 0;display:grid;grid-template-columns:44px 1fr 44px;align-items:center}.back{width:44px;height:44px;display:grid;place-items:center;border:1px solid #eee1d8;border-radius:50%;background:rgba(255,255,255,.62);color:#28211d}.back svg{width:25px;height:25px}.top h1{margin:0;text-align:center;font-size:17px;font-weight:650}.preview-wrap{padding:5px 20px 0}.preview{position:relative;aspect-ratio:9/13.5;overflow:hidden;border-radius:27px;background:#ead9cc;box-shadow:0 14px 30px rgba(104,62,28,.14)}.preview img{width:100%;height:100%;object-fit:cover}.preview::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,7,3,.04),rgba(10,6,2,.18) 55%,rgba(8,5,2,.46))}.type{position:absolute;z-index:1;top:16px;left:16px;height:27px;padding:0 10px;display:inline-flex;align-items:center;border:1px solid rgba(255,255,255,.48);border-radius:999px;background:rgba(35,21,10,.33);color:#fff;font-size:11px;backdrop-filter:blur(7px)}.play{position:absolute;z-index:1;left:50%;top:50%;width:64px;height:64px;display:none;place-items:center;transform:translate(-50%,-50%);border-radius:22px;background:var(--orange);color:#fff;box-shadow:0 10px 21px rgba(255,114,1,.38)}.play svg{width:30px;height:30px;margin-left:2px}.preview.video .play{display:grid}.video-note{position:absolute;z-index:1;bottom:17px;left:17px;right:17px;color:#fff;font-size:12px;line-height:1.5}.content{padding:22px 20px 0}.content h2{margin:     .preview{aspect-ratio:9/11;border-radius:24px}.preview-info{position:absolute;z-index:1;right:71px;bottom:18px;left:17px;color:#fff}.preview-info h2{margin:0;font-size:22px;letter-spacing:-.6px}.preview-info p{margin:5px 0 0;color:rgba(255,255,255,.84);font-size:12px;line-height:1.45}.preview-stats{position:absolute;z-index:2;right:13px;bottom:18px;display:grid;gap:9px}.preview-stats .stat{width:43px;height:43px;padding:4px 2px;flex-direction:column;justify-content:center;gap:1px;border-color:rgba(255,255,255,.48);border-radius:15px;background:rgba(30,18,9,.35);color:#fff;backdrop-filter:blur(7px);font-size:10px}.preview-stats .stat svg{width:17px;height:17px}.preview-stats .stat.like.active{border-color:#ffb5a8;background:rgba(211,72,56,.76);color:#fff}.preview-stats .stat.like.active svg{fill:#fff}.video-note{right:72px;bottom:92px;left:17px}.content{padding:14px 20px 0}.content>.detail-card,.content>h2,.content>p,.content>.stats{display:none}.make{margin-top:0}.play{width:58px;height:58px;border-radius:19px}

  <style>
    /* iPhone 17 portrait prototype canvas: 402 × 874 CSS px */
    .app{width:min(100%,402px);height:874px;min-height:874px;display:flex;flex-direction:column;overflow:hidden}.app>main{flex:1 1 auto;min-height:0;overflow-y:auto;scrollbar-width:none}.app>main::-webkit-scrollbar{display:none}.back{width:34px;height:34px;border:1px solid #edddd2;border-radius:12px;background:rgba(255,255,255,.64);color:#695f58}.back svg{width:19px;height:19px}.preview{aspect-ratio:9/16}.content{padding-bottom:24px}.bottom-nav{position:relative;z-index:20;bottom:auto;left:auto;width:100%;height:calc(64px + env(safe-area-inset-bottom));padding:5px 12px env(safe-area-inset-bottom);display:grid;grid-template-columns:repeat(4,1fr);flex:0 0 auto;transform:none;border-top:1px solid #efdcd0;background:rgba(255,253,251,.94);box-shadow:0 -8px 20px rgba(112,67,28,.07);backdrop-filter:blur(16px)}.nav-link{min-height:51px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:#8e847d;text-decoration:none;font-size:11px}.nav-link svg{width:27px;height:27px;overflow:visible}.nav-surface,.nav-glyph{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.nav-link.active{color:var(--orange);font-weight:600}.nav-link.active .nav-surface{fill:var(--orange);stroke:var(--orange)}.nav-link.active .nav-glyph{stroke:#fff}

  <style>.app{position:relative;padding-bottom:0}.preview-stats .stat.like.active{border-color:#ff2a2a;background:#ff2a2a;color:#fff}.preview-stats .stat.like.active svg{fill:#fff}.share-backdrop{position:absolute;z-index:40;inset:0;display:flex;align-items:flex-end;background:rgba(27,17,11,.43)}.share-backdrop[hidden]{display:none}.share-sheet{width:100%;padding:10px 20px calc(16px + env(safe-area-inset-bottom));border-radius:28px 28px 0 0;background:#fffdfa;box-shadow:0 -12px 28px rgba(72,39,16,.12)}.share-handle{width:42px;height:5px;margin:0 auto 17px;border-radius:5px;background:#ded8d3}.share-title{margin:0 0 18px;font-size:18px;text-align:center}.share-actions{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.share-option{display:flex;flex-direction:column;align-items:center;gap:7px;background:none;color:#746961;font-size:10px}.share-icon{width:44px;height:44px;display:grid;place-items:center;border-radius:15px;color:#fff;font-size:13px;font-weight:800}.share-icon.weixin{background:#13b96d}.share-icon.douyin{background:#1f1b1b}.share-icon.ins{background:linear-gradient(135deg,#6b3fd1,#e44b65,#f1a33d)}.share-icon.tiktok{background:#141212}.share-icon.copy{background:#fff1e5;color:var(--orange);border:1px solid #ffd2ae}.share-cancel{width:100%;height:47px;margin-top:19px;border-radius:16px;background:#f5eee8;color:#665c55;font-size:15px}</style>
  <style>
    /* 统一圆角：Banner 12px 为最大常规圆角。 */
    .preview{border-radius:12px}.back{border-radius:5px}.play{border-radius:9px}.preview-stats .stat{border-radius:7px}.make{border-radius:9px}.share-sheet{border-radius:14px 14px 0 0}.share-icon{border-radius:8px}.share-cancel{border-radius:8px}

<body>
  <div class="app">
    <header class="top"><button class="back" id="back" aria-label="返回"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m14.5 5-7 7 7 7"/></svg></button><span></span><span></span></header><main><div class="preview-wrap"><article class="preview" id="preview"><img id="cover" alt="模板预览"><span class="type" id="type"></span><button class="play" id="play" aria-label="播放"><svg viewBox="0 0 24 24" fill="currentColor"><path d="m8 5 11 7-11 7V5Z"/></svg></button><div class="preview-info"><h2 id="title"></h2><p id="description"></p></div><div class="preview-stats"><button class="stat like" id="like" aria-label="收藏"><svg viewBox="0 0 24 24"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 0 0 0-7.8Z"/></svg><span id="likeCount">0</span></button><button class="stat" id="share" aria-label="分享"><svg viewBox="0 0 24 24"><path d="M12 15V3m0 0L7.5 7.5M12 3l4.5 4.5M5 13.5v5.2A2.3 2.3 0 0 0 7.3 21h9.4a2.3 2.3 0 0 0 2.3-2.3v-5.2"/></svg><span id="shareCount">0</span></button></div><span class="video-note" id="videoNote">视频模板预览</span></article></div><section class="content"><div class="detail-card"><strong>模板说明</strong><span id="detail"></span></div><a class="make" id="make" href="../create-v1/create-v1.html">制作同款</a></section></main><nav class="bottom-nav"><a class="nav-link active" href="../home-v1/home-v1.html"><span>首页</span></a><a class="nav-link" href="../create-v1/create-v1.html"><span>创作</span></a><a class="nav-link" href="../assets-v1/assets-v1.html"><span>资产</span></a><a class="nav-link" href="../mine-v1/mine-v1.html"><span>我的</span></a></nav><div class="share-backdrop" id="shareBackdrop" hidden><section class="share-sheet" aria-label="分享模板"><div class="share-handle"></div><h2 class="share-title">分享至</h2><div class="share-actions"><button class="share-option" data-share-app="微信"><span class="share-icon weixin">微</span><span>微信</span></button><button class="share-option" data-share-app="抖音"><span class="share-icon douyin">抖</span><span>抖音</span></button><button class="share-option" data-share-app="Instagram"><span class="share-icon ins">◎</span><span>Instagram</span></button><button class="share-option" data-share-app="TikTok"><span class="share-icon tiktok">♪</span><span>TikTok</span></button><button class="share-option" data-share-app="copy"><span class="share-icon copy">↗</span><span>复制链接</span></button></div><button class="share-cancel" id="shareCancel">取消</button></section></div>
  </div>
  <script>
    const templates={perfume:{mode:'video',title:'香氛质感',description:'暖白光影里的高级新品视觉。',detail:'已预设商品素材、提示词与视频模型，进入创作后仍可随时替换和编辑。',asset:'../home-v1/assets/hero-perfume-v1.png',likes:268,shares:36},serum:{mode:'video',title:'焕亮精华',description:'通透水波与精华细节的产品宣传短片。',detail:'使用焕亮精华素材，适合突出通透、细腻与上新氛围。',asset:'../home-v1/assets/hero-serum-v1.png',likes:196,shares:18},sunglasses:{mode:'image',title:'夏日眼镜',description:'阳光、石材与度假氛围构成的商品主图。',detail:'已配置图片生成提示词与素材，适合快速产出社媒商品视觉。',asset:'../home-v1/assets/hero-sunglasses-v1.png',likes:319,shares:52},luxury:{mode:'video',title:'轻奢新品',description:'适合新品上新的高级质感短片。',detail:'暖调光影突出商品质感，可替换成你的产品图后直接制作。',asset:'../home-v1/assets/hero-perfume-v1.png',likes:142,shares:21},holiday:{mode:'image',title:'度假氛围',description:'明亮自然光下的生活方式商品图。',detail:'基于夏日场景与商品展示构图预设，可直接编辑并生成。',asset:'../home-v1/assets/hero-sunglasses-v1.png',likes:228,shares:34}};
    const query=new URLSearchParams(location.search),key=templates[query.get('template')]?query.get('template'):'perfume',item=templates[key];
    const preview=document.querySelector('#preview');preview.classList.toggle('video',item.mode==='video');document.querySelector('#cover').src=item.asset;document.querySelector('#type').textContent=item.mode==='video'?'视频模板':'图片模板';document.querySelector('#videoNote').hidden=item.mode!=='video';document.querySelector('#title').textContent=item.title;document.querySelector('#description').textContent=item.description;document.querySelector('#detail').textContent=item.detail;document.querySelector('#likeCount').textContent=item.likes;document.querySelector('#shareCount').textContent=item.shares;document.querySelector('#make').href=`../create-v1/create-v1.html?mode=${item.mode}&template=${key}`;
    const shareBackdrop=document.querySelector('#shareBackdrop');let liked=false,shared=false;document.querySelector('#like').addEventListener('click',()=>{liked=!liked;document.querySelector('#like').classList.toggle('active',liked);document.querySelector('#likeCount').textContent=item.likes+(liked?1:0)});document.querySelector('#share').addEventListener('click',()=>{if(!shared){shared=true;document.querySelector('#shareCount').textContent=item.shares+1}shareBackdrop.hidden=false});document.querySelectorAll('[data-share-app]').forEach(button=>button.addEventListener('click',()=>{const app=button.dataset.shareApp;if(app==='copy'){navigator.clipboard?.writeText(location.href);showShareMessage('链接已复制')}else showShareMessage(`已打开${app}分享`)}));function showShareMessage(message){shareBackdrop.hidden=true;const note=document.querySelector('#videoNote');note.textContent=message;note.hidden=false;setTimeout(()=>{if(item.mode!=='video')note.hidden=true},1600)}document.querySelector('#shareCancel').addEventListener('click',()=>shareBackdrop.hidden=true);shareBackdrop.addEventListener('click',event=>{if(event.target===shareBackdrop)shareBackdrop.hidden=true});document.querySelector('#play').addEventListener('click',()=>{document.querySelector('#videoNote').textContent='正在播放模板预览 · 00:08';document.querySelector('#play').style.transform='translate(-50%,-50%) scale(.9)'});document.querySelector('#back').addEventListener('click',()=>history.length>1?history.back():location.href='../templates-v1/templates-v1.html');
  </script>
  <script>
    const detailNav=document.querySelectorAll('.bottom-nav .nav-link');if(detailNav[2])detailNav[2].href='../assets-v1/assets-v1.html';if(detailNav[3])detailNav[3].href='../mine-v1/mine-v1.html';
  </script>
  <script>
    /* 发布作品与模板收藏共用本地数据源，便于后续直接替换为接口。 */
    (()=>{
      const params=new URLSearchParams(location.search),publishedId=params.get('published');
      const read=key=>{try{return JSON.parse(localStorage.getItem(key)||'[]')}catch(error){return []}},write=(key,value)=>localStorage.setItem(key,JSON.stringify(value));
      const published=read('maxai-published-works').find(work=>work.id===publishedId);
      const template=published||item;
      const favoriteId=published?`published:${published.id}`:`template:${key}`;
      if(published){
        preview.classList.toggle('video',published.type==='video');
        document.querySelector('#cover').src=published.asset;
        document.querySelector('#type').textContent=published.type==='video'?'视频模板':'图片模板';
        document.querySelector('#title').textContent=published.title;
        document.querySelector('#description').textContent=`${published.category} · ${published.type==='video'?'视频作品':'图片作品'}`;
        document.querySelector('#detail').textContent=published.prompt||'创作者发布的作品模板。';
        document.querySelector('#likeCount').textContent=published.likes||0;
        document.querySelector('#make').href=`../create-v1/create-v1.html?creation=${encodeURIComponent(published.creationId)}`;
      }
      const like=document.querySelector('#like'),count=document.querySelector('#likeCount');
      const favorites=read('maxai-favorite-templates');
      if(favorites.some(entry=>entry.id===favoriteId)){like.classList.add('active');count.textContent=(template.likes||0)+1}
      like.addEventListener('click',()=>{
        let records=read('maxai-favorite-templates');
        const nextFavorite=!records.some(entry=>entry.id===favoriteId);
        if(!nextFavorite){
          records=records.filter(entry=>entry.id!==favoriteId);
          count.textContent=template.likes||0;
        }else{
          records=[{id:favoriteId,title:template.title,asset:template.asset,type:published?published.type:template.mode,likes:template.likes||0,templateId:published?.id||key},...records.filter(entry=>entry.id!==favoriteId)];
          count.textContent=(template.likes||0)+1;
        }
        like.classList.toggle('active',nextFavorite);
        write('maxai-favorite-templates',records);
      });
    })();
  </script>
<script>
  (()=>{const nav=document.querySelector('.bottom-nav');if(!nav)return;const icons=['<svg viewBox="0 0 28 28"><rect class="nav-surface" x="3.5" y="4.2" width="21" height="20" rx="6.3"/><path class="nav-glyph" d="M8.5 17.7v-7.1l5.5 4.5 5.5-4.5v7.1"/></svg>','<svg viewBox="0 0 28 28"><rect class="nav-surface" x="3.5" y="3.5" width="21" height="21" rx="7"/><path class="nav-glyph" d="M14 7.4c.55 3.8 2.35 5.6 6.2 6.2-3.85.6-5.65 2.4-6.2 6.2-.55-3.8-2.35-5.6-6.2-6.2 3.85-.6 5.65-2.4 6.2-6.2Z"/></svg>','<svg viewBox="0 0 28 28"><rect class="nav-surface" x="3.5" y="3.5" width="21" height="21" rx="7"/><path class="nav-glyph" d="M8.25 10.25h11.5v8H8.25zM10.2 10.25V8.8h4.95l1.4 1.45M11.1 13.1h5.8M11.1 15.55h3.5"/></svg>','<svg viewBox="0 0 28 28"><rect class="nav-surface" x="3.5" y="3.5" width="21" height="21" rx="7"/><circle class="nav-glyph" cx="14" cy="10" r="3.05"/><path class="nav-glyph" d="M8.35 20.05c.48-3.25 2.35-4.9 5.65-4.9s5.17 1.65 5.65 4.9"/></svg>'];nav.querySelectorAll('.nav-link').forEach((link,index)=>link.insertAdjacentHTML('afterbegin',icons[index]))})();
</script>
