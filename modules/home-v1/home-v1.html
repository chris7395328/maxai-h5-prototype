    const catalog={video:[['热门推荐','新品视觉大片|质感细节特写|品牌氛围展示|橱窗上新|热点卖点|广告封面'],['新品介绍','新品首发介绍|核心功能讲解|开箱亮相视频|品牌新品故事|新品细节展示|上市预热视频'],['三个卖点','三大核心卖点|功能优势拆解|材质工艺亮点|使用效果对比|产品优势速览|卖点字幕短片'],['促销口播','限时折扣口播|直播间引流|节日促销预告|达人种草推荐|优惠信息播报|爆款带货短片'],['产品展示','全方位产品展示|使用场景演示|质感细节特写|包装开箱展示|产品功能演示|品牌氛围展示']],image:[['热门推荐','新品主图设计|视觉海报创作|品牌氛围KV|场景化产品图|高级质感大片|社媒封面设计'],['新品介绍','新品首发海报|产品亮相主图|新品功能长图|新品细节展示|上市预告封面|新品故事视觉'],['三个卖点','三大卖点海报|功能优势排版|材质亮点展示|效果对比主图|核心参数信息图|卖点合集封面'],['促销口播','限时优惠海报|直播预告封面|节日促销主图|达人推荐封面|优惠券推广图|爆款带货主图'],['产品展示','产品全景主图|场景化产品图|质感细节特写|包装组合展示|功能演示长图|品牌氛围KV']]};
    function render(mode){const templateKeys=mode==='video'?['perfume','serum','luxury']:['sunglasses','holiday','sunglasses'];document.querySelector('#sections').innerHTML=catalog[mode].map(([title,labels],index)=>{const cards=labels.split('|').map((label,i)=>`<a class="template-card media-${(i+index)%6}" href="../template-detail-v1/template-detail-v1.html?template=${templateKeys[(i+index)%templateKeys.length]}" aria-label="${label}"><span>${label}</span></a>`).join('');return `<section class="section"><div class="section-heading"><h2 class="section-title">${title}</h2><a class="more" href="../templates-v1/templates-v1.html">查看更多</a></div><div class="template-grid">${cards}</div></section>`;}).join('');}
    render('video');
    document.querySelectorAll('.tag').forEach(tag=>tag.addEventListener('click',()=>{document.querySelectorAll('.tag').forEach(item=>{item.classList.toggle('active',item===tag);item.setAttribute('aria-selected',item===tag?'true':'false');});render(tag.dataset.mode);}));
    const toast=document.querySelector('.toast');let toastTimer;
    function showToast(message){toast.textContent=message;toast.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.classList.remove('show'),1800);}
    document.addEventListener('click',event=>{const target=event.target.closest('[data-toast],[data-route]');if(!target)return;if(target.dataset.route){event.preventDefault();location.href=target.dataset.route==='assets'?'../assets-v1/assets-v1.html':'../mine-v1/mine-v1.html';}else{showToast(target.dataset.toast);}});
    const languageButton=document.querySelector('#languageButton'),languageMenu=document.querySelector('#languageMenu');languageButton.addEventListener('click',event=>{event.stopPropagation();const open=languageMenu.hidden;languageMenu.hidden=!open;languageButton.setAttribute('aria-expanded',String(open));});languageMenu.addEventListener('click',event=>{const option=event.target.closest('[data-language]');if(!option)return;languageButton.textContent=option.dataset.language;languageMenu.hidden=true;languageButton.setAttribute('aria-expanded','false');showToast(`语言已切换为 ${option.dataset.language}`)});document.addEventListener('click',event=>{if(!event.target.closest('.quick-actions')){languageMenu.hidden=true;languageButton.setAttribute('aria-expanded','false')}});
  </script>
  <script>
    (()=>{
      const sections=document.querySelector('#sections');
      const read=()=>{try{return JSON.parse(localStorage.getItem('maxai-published-works')||'[]')}catch(error){return []}};
      function draw(mode){
        sections.querySelector('.published-section')?.remove();
        const works=read().filter(work=>work.type===mode).slice(0,6);if(!works.length)return;
        const cards=works.map(work=>`<a class="template-card" href="../template-detail-v1/template-detail-v1.html?published=${encodeURIComponent(work.id)}" style="background-image:linear-gradient(180deg,transparent 45%,rgba(0,0,0,.64)),url('${work.asset}');background-size:cover;background-position:center"><span style="position:absolute;z-index:2;top:7px;left:7px;padding:3px 5px;border-radius:4px;background:rgba(255,255,255,.88);color:#ff7201;font-size:9px">${work.category}</span><span>${work.title}</span></a>`).join('');
        sections.insertAdjacentHTML('beforeend',`<section class="section published-section"><div class="section-heading"><h2 class="section-title">我的发布</h2><a class="more" href="../templates-v1/templates-v1.html">查看更多</a></div><div class="template-grid">${cards}</div></section>`);
      }
      const currentMode=()=>document.querySelector('.template-tags .tag.active')?.dataset.mode||'video';
      draw(currentMode());
      document.querySelectorAll('.template-tags .tag').forEach(button=>button.addEventListener('click',()=>setTimeout(()=>draw(currentMode()),0)));
      window.addEventListener('storage',event=>{if(event.key==='maxai-published-works')draw(currentMode())});
      document.addEventListener('visibilitychange',()=>{if(!document.hidden)draw(currentMode())});
    })();
  </script>
</body>
</html>
