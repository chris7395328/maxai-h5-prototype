  <style>
    :root{--orange:#ff7201;--cream:#fff9f3;--paper:#fffdfa;--ink:#161311;--muted:#8f837a;--line:#efddd0}*{box-sizing:border-box}html,body{margin:0;background:var(--cream);color:var(--ink);font-family:"PingFang SC","Microsoft YaHei",Arial,sans-serif}button,textarea{font:inherit}button{border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}.app{position:relative;width:min(100%,402px);height:874px;margin:auto;display:flex;flex-direction:column;overflow:hidden;background:var(--cream)}main{flex:1;min-height:0;overflow-y:auto;padding:calc(12px + env(safe-area-inset-top)) 20px 28px;scrollbar-width:none}.head{display:grid;grid-template-columns:30px 1fr 30px;align-items:center}.back{width:30px;height:30px;display:grid;place-items:center;border:1px solid var(--line);border-radius:5px;background:rgba(255,255,255,.7);color:#685e57}.back svg{width:17px;height:17px}.head h1{margin:0;text-align:center;font-size:17px}.intro{margin:23px 0 20px}.intro h2{margin:0 0 7px;font-size:21px}.intro p{margin:0;color:var(--muted);font-size:12px}.field-label{display:block;margin:0 0 8px;font-size:13px}.textarea-wrap{position:relative}.textarea-wrap textarea{width:100%;height:142px;resize:none;padding:14px 14px 30px;border:1px solid var(--line);border-radius:10px;outline:none;background:var(--paper);color:var(--ink);font-size:16px;line-height:1.55}.textarea-wrap textarea:focus{border-color:#ffb273;box-shadow:0 0 0 3px rgba(255,114,1,.09)}.count{position:absolute;right:12px;bottom:10px;color:#aaa099;font-size:11px}.upload{width:100%;min-height:116px;margin-top:18px;padding:14px;display:grid;place-items:center;border:1px dashed #dccbc0;border-radius:10px;background:rgba(255,253,250,.66);color:#786d65}.upload svg{width:24px;height:24px;color:var(--orange)}.upload b{display:block;margin:6px 0 4px;font-size:13px}.upload small{display:block;color:#a0968e;font-size:10px}.files{display:flex;gap:7px;margin-top:8px;overflow-x:auto}.file{position:relative;width:52px;height:52px;flex:0 0 auto;overflow:hidden;border:1px solid var(--line);border-radius:7px;background:#fff0e4}.file img{width:100%;height:100%;object-fit:cover}.submit{width:100%;height:44px;margin-top:18px;border-radius:8px;background:var(--orange);color:#fff;font-size:15px;font-weight:700;box-shadow:0 8px 18px rgba(255,114,1,.22)}.contact-title{margin:28px 0 12px;font-size:14px}.contacts{display:grid;grid-template-columns:1fr 1fr;gap:12px}.contact{padding:12px 8px;border:1px solid var(--line);border-radius:10px;background:var(--paper);text-align:center}.qr{width:105px;height:105px;margin:auto;padding:8px;border:1px solid #eee0d6;border-radius:8px;background:#fff}.qr-pattern{width:100%;height:100%;background:repeating-conic-gradient(#151210 0 25%,transparent 0 50%) 0 0/12px 12px;mask:radial-gradient(circle at 50% 50%,transparent 0 8px,#000 9px)}.contact b{display:block;margin-top:8px;font-size:12px}.contact small{display:block;margin-top:3px;color:var(--orange);font-size:10px}.hint{margin:10px 0 0;color:#a0968e;font-size:10px;line-height:1.5}.bottom-nav{height:calc(68px + env(safe-area-inset-bottom));padding:6px 16px calc(7px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(4,1fr);flex:0 0 auto;align-items:center;justify-items:center;border-top:1px solid #efdcd0;background:rgba(255,253,251,.94);box-shadow:0 -8px 20px rgba(112,67,28,.07)}.nav-link{width:100%;min-height:51px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:#8e847d;text-decoration:none;font-size:11px}.nav-link svg{width:27px;height:27px}.nav-surface,.nav-glyph{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.nav-link.active{color:var(--orange);font-weight:600}.nav-link.active .nav-surface{fill:var(--orange);stroke:var(--orange)}.nav-link.active .nav-glyph{stroke:#fff}.toast{position:absolute;z-index:20;left:50%;bottom:84px;padding:9px 14px;transform:translate(-50%,12px);border-radius:999px;background:rgba(27,19,14,.88);color:#fff;font-size:12px;opacity:0;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}@media(prefers-reduced-motion:reduce){.toast{transition:none}}
  </style>

<body><div class="app"><main><header class="head"><button class="back" id="back" aria-label="返回"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m14.5 5-7 7 7 7"/></svg></button><h1>联系客服</h1><span></span></header><section class="intro"><h2>提交工单</h2><p>告诉我们遇到的问题，客服团队会尽快处理。</p></section><label class="field-label" for="issue">描述你的问题</label><div class="textarea-wrap"><textarea id="issue" maxlength="2000" placeholder="请尽量说明发生了什么、你期望的结果…"></textarea><span class="count"><b id="count">0</b> / 2000</span></div><button class="upload" id="upload"><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 5h16v14H4zM7 15l3-3 2.5 2.5L15 12l3 3M9 9h.01"/></svg><b>上传截图 / 视频（可选）</b><small>支持 JPG / PNG / WebP / MP4，最多 10 个</small></span></button><input id="fileInput" type="file" accept="image/*,video/*" multiple hidden><div class="files" id="files"></div><button class="submit" id="submit">提交工单</button><h3 class="contact-title">也可以直接联系我们</h3><section class="contacts"><article class="contact"><div class="qr"><div class="qr-pattern"></div></div><b>WhatsApp 客服</b><small>扫码联系我们</small></article><article class="contact"><div class="qr"><div class="qr-pattern" style="filter:sepia(1) saturate(7) hue-rotate(340deg)"></div></div><b>Instagram</b><small>扫码关注我们</small></article></section><p class="hint">当前为原型演示二维码位，正式接入时替换为客服账号对应的真实二维码。</p></main><nav class="bottom-nav"><a class="nav-link" href="../home-v1/home-v1.html"><svg viewBox="0 0 28 28"><rect class="nav-surface" x="3.5" y="4.2" width="21" height="20" rx="6.3"/><path class="nav-glyph" d="M8.5 17.7v-7.1l5.5 4.5 5.5-4.5v7.1"/></svg><span>首页</span></a><a class="nav-link" href="../create-v1/create-v1.html"><svg viewBox="0 0 28 28"><rect class="nav-surface" x="3.5" y="3.5" width="21" height="21" rx="7"/><path class="nav-glyph" d="M14 7.4c.55 3.8 2.35 5.6 6.2 6.2-3.85.6-5.65 2.4-6.2 6.2-.55-3.8-2.35-5.6-6.2-6.2 3.85-.6 5.65-2.4 6.2-6.2Z"/></svg><span>创作</span></a><a class="nav-link" href="../assets-v1/assets-v1.html"><svg viewBox="0 0 28 28"><rect class="nav-surface" x="3.5" y="3.5" width="21" height="21" rx="7"/><path class="nav-glyph" d="M8.25 10.25h11.5v8H8.25zM10.2 10.25V8.8h4.95l1.4 1.45M11.1 13.1h5.8M11.1 15.55h3.5"/></svg><span>资产</span></a><a class="nav-link active" href="../mine-v1/mine-v1.html"><svg viewBox="0 0 28 28"><rect class="nav-surface" x="3.5" y="3.5" width="21" height="21" rx="7"/><circle class="nav-glyph" cx="14" cy="10" r="3.05"/><path class="nav-glyph" d="M8.35 20.05c.48-3.25 2.35-4.9 5.65-4.9s5.17 1.65 5.65 4.9"/></svg><span>我的</span></a></nav><div class="toast" id="toast">工单已提交</div></div><script>if(localStorage.getItem('maxai-auth')!=='1')location.replace('../login-v1/login-v1.html?return='+encodeURIComponent(location.href));const issue=document.querySelector('#issue'),count=document.querySelector('#count'),input=document.querySelector('#fileInput'),files=document.querySelector('#files');issue.oninput=()=>count.textContent=issue.value.length;document.querySelector('#upload').onclick=()=>input.click();input.onchange=()=>{const selected=[...input.files].slice(0,10);files.innerHTML=selected.map(file=>file.type.startsWith('image/')?`<span class="file"><img src="${URL.createObjectURL(file)}" alt="已选择截图"></span>`:`<span class="file" style="display:grid;place-items:center;color:#ff7201;font-size:10px">视频</span>`).join('')};document.querySelector('#submit').onclick=()=>{if(!issue.value.trim()){issue.focus();issue.style.borderColor='#ff7201';return}localStorage.setItem('maxai-latest-ticket',JSON.stringify({content:issue.value.trim(),attachments:input.files.length,createdAt:new Date().toISOString()}));const toast=document.querySelector('#toast');toast.classList.add('show');setTimeout(()=>{toast.classList.remove('show');issue.value='';count.textContent='0';files.innerHTML='';input.value=''},1500)};document.querySelector('#back').onclick=()=>history.length>1?history.back():location.href='../mine-v1/mine-v1.html';</script></body></html>
