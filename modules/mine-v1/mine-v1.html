<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>MaxAi · 我的</title>
<style>
:root{--orange:#ff7201;--cream:#fff9f3;--paper:#fffdfa;--ink:#161311;--line:#efddd0;--muted:#8f837a}*{box-sizing:border-box}html,body{margin:0;background:var(--cream);color:var(--ink);font-family:"PingFang SC","Microsoft YaHei",Arial,sans-serif}button,a{font:inherit;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}.app{position:relative;width:min(100%,402px);height:874px;margin:auto;display:flex;flex-direction:column;overflow:hidden;background:var(--cream)}main{flex:1;min-height:0;overflow-y:auto;padding:calc(12px + env(safe-area-inset-top)) 20px 22px;scrollbar-width:none}.top{display:flex;align-items:center;justify-content:space-between}.back,.top-action{width:30px;height:30px;display:grid;place-items:center;border:1px solid var(--line);border-radius:5px;background:rgba(255,255,255,.64);color:#685e57}.back svg{width:17px;height:17px}.top-actions{display:flex;gap:7px}.top-action svg{width:15px;height:15px}.profile{text-align:center;margin:25px 0 18px}.avatar{width:86px;height:86px;margin:auto;display:grid;place-items:center;border:2px solid #ffe0c5;border-radius:50%;background:#fff0e4;color:var(--orange);font-size:31px;font-weight:800}.profile h1{margin:11px 0 8px;font-size:23px}.edit{height:30px;padding:0 13px;border:1px solid var(--orange);border-radius:999px;background:var(--paper);color:var(--orange);font-size:12px}.summary{display:grid;gap:9px}.summary-item{display:flex;align-items:center;width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:9px;background:var(--paper);text-align:left}.summary-icon{width:32px;height:32px;display:grid;place-items:center;border-radius:50%;background:#fff0e4;color:var(--orange);font-size:17px}.summary-copy{margin-left:10px}.summary-copy b{font-size:14px}.summary-copy small{display:block;margin-top:3px;color:var(--muted);font-size:11px}.chevron{margin-left:auto;color:#968b83;font-size:21px}.tabs{display:grid;grid-template-columns:1fr 1fr;margin-top:22px;border-bottom:1px solid var(--line)}.tab{position:relative;height:40px;background:none;color:#978c83;font-size:14px}.tab.active{color:var(--orange);font-weight:700}.tab.active::after{content:"";position:absolute;bottom:-1px;left:25%;width:50%;height:3px;background:var(--orange)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding-top:14px}.card{position:relative;overflow:hidden;border-radius:8px;background:#eadbd0}.card img{display:block;width:100%;aspect-ratio:1;object-fit:cover}.card-meta{position:absolute;right:8px;bottom:7px;left:8px;display:flex;justify-content:space-between;color:#fff;font-size:10px;text-shadow:0 1px 4px #000}.picker{position:absolute;z-index:3;top:8px;right:8px;width:25px;height:25px;display:grid;place-items:center;border:2px solid #fff;border-radius:50%;background:rgba(25,18,12,.28);color:transparent;box-shadow:0 2px 6px rgba(0,0,0,.18)}.card.selected .picker{border-color:var(--orange);background:var(--orange);color:#fff}.empty{grid-column:1/-1;padding:38px 0;color:var(--muted);text-align:center;font-size:12px}.bottom-nav{height:calc(68px + env(safe-area-inset-bottom));padding:6px 16px calc(7px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(4,1fr);flex:0 0 auto;align-items:center;justify-items:center;border-top:1px solid #efdcd0;background:rgba(255,253,251,.94);box-shadow:0 -8px 20px rgba(112,67,28,.07)}.nav-link{width:100%;min-height:51px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:#8e847d;text-decoration:none;font-size:11px}.nav-link svg{width:27px;height:27px;overflow:visible}.nav-surface,.nav-glyph{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.nav-link.active{color:var(--orange);font-weight:600}.nav-link.active .nav-surface{fill:var(--orange);stroke:var(--orange)}.nav-link.active .nav-glyph{stroke:#fff}.batch-bar{position:absolute;z-index:12;right:14px;bottom:calc(76px + env(safe-area-inset-bottom));left:14px;display:none;gap:8px;padding:8px;border:1px solid var(--line);border-radius:10px;background:rgba(255,253,251,.98);box-shadow:0 12px 28px rgba(77,42,17,.16)}.batch-bar.show{display:flex}.batch-bar button{height:38px;flex:1;border-radius:6px;background:#fff0e4;color:var(--orange);font-size:13px}.batch-bar .danger{background:#fff1f0;color:#df4841}
</style></head><body><div class="app"><main><header class="top"><button class="back" id="back" aria-label="返回"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m14.5 5-7 7 7 7"/></svg></button><div class="top-actions"><button class="top-action" aria-label="通知"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 9a6 6 0 0 0-12 0c0 7-3 7-3 8h18c0-1-3-1-3-8M10 20h4"/></svg></button><button class="top-action" id="settings" aria-label="设置"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2.8v2M12 19.2v2M2.8 12h2M19.2 12h2M5.5 5.5l1.4 1.4M17.1 17.1l1.4 1.4M18.5 5.5l-1.4 1.4M6.9 17.1l-1.4 1.4"/></svg></button></div></header><section class="profile"><div class="avatar">M</div><h1>MaxAi 用户</h1><button class="edit">编辑资料</button></section><section class="summary"><button class="summary-item" id="subscription"><span class="summary-icon">◆</span><span class="summary-copy"><b id="plan">未订阅</b><small id="planSub">订阅后解锁更多创作额度</small></span><span class="chevron">›</span></button><button class="summary-item" id="credits"><span class="summary-icon">✦</span><span class="summary-copy"><b id="credit">0 积分</b><small>查看积分获取与消耗明细</small></span><span class="chevron">›</span></button></section><nav class="tabs"><button class="tab active" data-tab="works">作品</button><button class="tab" data-tab="favorites">收藏</button></nav><div class="grid" id="grid"></div></main><nav class="bottom-nav"><a class="nav-link" href="../home-v1/home-v1.html"><span>首页</span></a><a class="nav-link" href="../create-v1/create-v1.html"><span>创作</span></a><a class="nav-link" href="../assets-v1/assets-v1.html"><span>资产</span></a><a class="nav-link active" href="mine-v1.html"><svg viewBox="0 0 28 28"><rect class="nav-surface" x="3.5" y="3.5" width="21" height="21" rx="7"/><circle class="nav-glyph" cx="14" cy="10" r="3.05"/><path class="nav-glyph" d="M8.35 20.05c.48-3.25 2.35-4.9 5.65-4.9s5.17 1.65 5.65 4.9"/></svg><span>我的</span></a></nav><div class="batch-bar" id="batchBar"><button id="batchCancel">取消选择</button><button class="danger" id="batchConfirm">删除作品</button></div></div>
<script>
if(localStorage.getItem('maxai-auth')!=='1')location.replace('../login-v1/login-v1.html?return='+encodeURIComponent(location.href));
if(performance.getEntriesByType('navigation')[0]?.type==='reload'){localStorage.removeItem('maxai-subscription');localStorage.removeItem('maxai-credit')}
const read=key=>{try{return JSON.parse(localStorage.getItem(key)||'[]')}catch(error){return[]}},write=(key,value)=>localStorage.setItem(key,JSON.stringify(value));let activeTab='works',selected=new Set();
function publishedWorks(){const merged=[...read('maxai-published-works'),...read('maxai-template-feed')],map=new Map();merged.forEach(item=>map.set(item.id,item));return [...map.values()]}
function renderTop(){let subscription=null;try{subscription=JSON.parse(localStorage.getItem('maxai-subscription')||'null')}catch(error){}const points=+localStorage.getItem('maxai-credit')||0;document.querySelector('#plan').textContent=subscription?`已订阅：${subscription.name}`:'未订阅';document.querySelector('#planSub').textContent=subscription?`剩余 ${points.toLocaleString()} 积分`:'订阅后解锁更多创作额度';document.querySelector('#credit').textContent=`${points.toLocaleString()} 积分`}
function currentItems(){return activeTab==='works'?publishedWorks():read('maxai-favorite-templates')}
function render(){const items=currentItems(),grid=document.querySelector('#grid');grid.innerHTML=items.length?items.map(item=>`<article class="card ${selected.has(item.id)?'selected':''}" data-id="${item.id}"><button class="picker" aria-label="选择 ${item.title}">✓</button><img src="${item.asset}" alt="${item.title}"><div class="card-meta"><span>${item.title}</span><span>♡ ${item.likes||0}</span></div></article>`).join(''):`<p class="empty">${activeTab==='works'?'发布作品后会在这里展示':'收藏模板后会在这里展示'}</p>`;document.querySelector('#batchBar').classList.toggle('show',selected.size>0);document.querySelector('#batchConfirm').textContent=activeTab==='works'?'删除作品':'取消收藏'}
document.querySelector('#grid').addEventListener('click',event=>{const card=event.target.closest('.card');if(!card)return;const id=card.dataset.id;if(event.target.closest('.picker')){selected.has(id)?selected.delete(id):selected.add(id);render();return}location.href=activeTab==='works'?`../template-detail-v1/template-detail-v1.html?published=${encodeURIComponent(id)}`:`../template-detail-v1/template-detail-v1.html?${id.startsWith('template:')?'template='+encodeURIComponent(id.slice(9)):'published='+encodeURIComponent(id.replace('published:',''))}`});
document.querySelectorAll('.tab').forEach(tab=>tab.addEventListener('click',()=>{activeTab=tab.dataset.tab;selected.clear();document.querySelectorAll('.tab').forEach(item=>item.classList.toggle('active',item===tab));render()}));
document.querySelector('#batchCancel').addEventListener('click',()=>{selected.clear();render()});document.querySelector('#batchConfirm').addEventListener('click',()=>{if(!confirm(activeTab==='works'?'删除选中作品并取消模板发布？':'取消选中的模板收藏？'))return;if(activeTab==='works'){write('maxai-published-works',read('maxai-published-works').filter(item=>!selected.has(item.id)));write('maxai-template-feed',read('maxai-template-feed').filter(item=>!selected.has(item.id)));write('maxai-favorite-templates',read('maxai-favorite-templates').filter(item=>!selected.has(item.templateId)&&!selected.has(String(item.id).replace('published:',''))))}else write('maxai-favorite-templates',read('maxai-favorite-templates').filter(item=>!selected.has(item.id)));selected.clear();render()});
document.querySelector('#back').onclick=()=>history.length>1?history.back():location.href='../home-v1/home-v1.html';document.querySelector('#settings').onclick=()=>location.href='../settings-v1/settings-v1.html';document.querySelector('#subscription').onclick=()=>location.href='../subscription-v1/subscription-v1.html?return='+encodeURIComponent(location.href);document.querySelector('#credits').onclick=()=>location.href='../credits-v1/credits-v1.html';document.addEventListener('visibilitychange',()=>{if(!document.hidden){renderTop();render()}});renderTop();render();
</script>
<script>
  /* “我的”使用与其他导航一致的圆角方形底板，避免激活后只剩头像圆。 */
  document.querySelector('.bottom-nav .nav-link:last-child svg').outerHTML='<svg viewBox="0 0 28 28" aria-hidden="true"><rect class="nav-surface" x="3.5" y="3.5" width="21" height="21" rx="7"/><circle class="nav-glyph" cx="14" cy="10" r="3.15"/><path class="nav-glyph" d="M8.2 21c.55-3.45 2.48-5.15 5.8-5.15s5.25 1.7 5.8 5.15"/></svg>';
  const iconTuning=document.createElement('style');
  iconTuning.textContent='.top-action{width:28px;height:28px}.top-action svg{width:14px;height:14px}.top-actions{gap:6px}';
  document.head.append(iconTuning);
</script>
<script>
  (()=>{const nav=document.querySelector('.bottom-nav');if(!nav)return;const icons=['<svg viewBox="0 0 28 28"><rect class="nav-surface" x="3.5" y="4.2" width="21" height="20" rx="6.3"/><path class="nav-glyph" d="M8.5 17.7v-7.1l5.5 4.5 5.5-4.5v7.1"/></svg>','<svg viewBox="0 0 28 28"><rect class="nav-surface" x="3.5" y="3.5" width="21" height="21" rx="7"/><path class="nav-glyph" d="M14 7.4c.55 3.8 2.35 5.6 6.2 6.2-3.85.6-5.65 2.4-6.2 6.2-.55-3.8-2.35-5.6-6.2-6.2 3.85-.6 5.65-2.4 6.2-6.2Z"/></svg>','<svg viewBox="0 0 28 28"><rect class="nav-surface" x="3.5" y="3.5" width="21" height="21" rx="7"/><path class="nav-glyph" d="M8.25 10.25h11.5v8H8.25zM10.2 10.25V8.8h4.95l1.4 1.45M11.1 13.1h5.8M11.1 15.55h3.5"/></svg>','<svg viewBox="0 0 28 28"><rect class="nav-surface" x="3.5" y="3.5" width="21" height="21" rx="7"/><circle class="nav-glyph" cx="14" cy="10" r="3.05"/><path class="nav-glyph" d="M8.35 20.05c.48-3.25 2.35-4.9 5.65-4.9s5.17 1.65 5.65 4.9"/></svg>'];nav.querySelectorAll('.nav-link').forEach((link,index)=>{link.querySelector('svg')?.remove();link.insertAdjacentHTML('afterbegin',icons[index])})})();
</script>
<script>
  (()=>{const button=document.querySelector('#settings');if(button)button.innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9.75 3.6h4.5l.55 2.15c.55.23 1.08.53 1.55.9l2.12-.62 2.25 3.9-1.58 1.54c.04.35.06.7.06 1.05s-.02.7-.06 1.05l1.58 1.54-2.25 3.9-2.12-.62c-.47.37-1 .67-1.55.9l-.55 2.15h-4.5l-.55-2.15a7.7 7.7 0 0 1-1.55-.9l-2.12.62-2.25-3.9 1.58-1.54A8.2 8.2 0 0 1 4.8 12.5c0-.35.02-.7.06-1.05L3.28 9.91l2.25-3.9 2.12.62c.47-.37 1-.67 1.55-.9l.55-2.13Z"/><circle cx="12" cy="12.5" r="3"/></svg>'})();
</script>
<script>
  (()=>{
    const tabs=document.querySelectorAll('.tabs .tab');
    if(tabs[0])tabs[0].textContent='我的模板';
    if(tabs[1])tabs[1].textContent='收藏模板';
    const renderLabels=()=>{
      const empty=document.querySelector('.empty');
      if(empty)empty.textContent=activeTab==='works'?'发布模板后会在这里展示':'收藏的模板会在这里展示';
      const action=document.querySelector('#batchConfirm');
      if(action)action.textContent=activeTab==='works'?'删除模板':'取消收藏';
    };
    new MutationObserver(renderLabels).observe(document.querySelector('#grid'),{childList:true});
    renderLabels();
    const notification=document.querySelector('.top-actions .top-action');
    if(notification&&!document.querySelector('#support')){
      notification.insertAdjacentHTML('beforebegin','<button class="top-action" id="support" aria-label="联系客服"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12a7 7 0 0 1 14 0v4.2a2 2 0 0 1-2 2h-1.5"/><path d="M5 12v4H3.8A1.8 1.8 0 0 1 2 14.2v-.4A1.8 1.8 0 0 1 3.8 12H5Zm14 0v4h1.2a1.8 1.8 0 0 0 1.8-1.8v-.4a1.8 1.8 0 0 0-1.8-1.8H19Z"/><path d="M13.5 18.2h2"/></svg></button>');
      document.querySelector('#support').onclick=()=>location.href='../support-v1/support-v1.html';
    }
  })();
</script>
</body></html>
