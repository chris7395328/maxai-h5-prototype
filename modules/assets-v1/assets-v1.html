      const assetPreview=document.createElement('section'),assetShare=document.createElement('div'),deleteDialog=document.createElement('div');assetPreview.className='asset-preview';assetPreview.hidden=true;assetPreview.innerHTML='<header class="asset-preview-top"><button class="preview-close" id="previewClose" aria-label="关闭预览"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 6 12 12M18 6 6 18"/></svg></button><span class="preview-kind" id="previewKind">图片</span></header><div class="asset-preview-media"><img id="previewImage" alt="素材预览"><button class="preview-play" id="previewPlay" aria-label="播放视频"><svg viewBox="0 0 24 24" fill="currentColor"><path d="m8 5 11 7-11 7V5Z"/></svg></button></div><div class="preview-actions"><button class="preview-action" id="previewDownload" aria-label="下载素材"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v11M8 10l4 4 4-4M5 16v4h14v-4"/></svg></button><button class="preview-action" id="previewShare" aria-label="分享素材"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3m0 0L7.5 7.5M12 3l4.5 4.5M5 13.5v5.2A2.3 2.3 0 0 0 7.3 21h9.4a2.3 2.3 0 0 0 2.3-2.3v-5.2"/></svg></button></div>';assetShare.className='asset-share';assetShare.hidden=true;assetShare.innerHTML='<section class="asset-share-sheet"><div class="asset-share-handle"></div><h2 class="asset-share-title">分享至</h2><div class="asset-share-actions"><button class="asset-share-option" data-asset-share="微信"><span class="asset-share-icon weixin">微</span><span>微信</span></button><button class="asset-share-option" data-asset-share="抖音"><span class="asset-share-icon douyin">抖</span><span>抖音</span></button><button class="asset-share-option" data-asset-share="Instagram"><span class="asset-share-icon ins">◎</span><span>Instagram</span></button><button class="asset-share-option" data-asset-share="TikTok"><span class="asset-share-icon tiktok">♪</span><span>TikTok</span></button><button class="asset-share-option" data-asset-share="copy"><span class="asset-share-icon copy">↗</span><span>复制链接</span></button></div><button class="asset-share-cancel" id="assetShareCancel">取消</button></section>';deleteDialog.className='publish-confirm';deleteDialog.innerHTML='<section class="publish-confirm-card" role="dialog" aria-modal="true" aria-labelledby="deleteTitle"><h2 id="deleteTitle">确认删除？</h2><p id="deleteCopy">删除后无法在当前原型中恢复。</p><div class="publish-confirm-actions"><button type="button" data-delete-cancel>取消</button><button type="button" class="confirm" data-delete-confirm>确认删除</button></div></section>';app.append(assetPreview,assetShare,deleteDialog);
      let assetToastTimer;
      function showAssetToast(text){assetToast.textContent=text;assetToast.classList.add('show');clearTimeout(assetToastTimer);assetToastTimer=setTimeout(()=>assetToast.classList.remove('show'),1600)}
      function openAssetPreview(asset){state.previewAsset=asset;assetPreview.classList.toggle('video',asset.type==='video');document.querySelector('#previewImage').src=asset.src;document.querySelector('#previewKind').textContent=asset.type==='video'?'视频':'图片';assetPreview.hidden=false}

      document.querySelector('#previewClose').addEventListener('click',()=>assetPreview.hidden=true);document.querySelector('#previewPlay').addEventListener('click',()=>showAssetToast('正在播放视频'));document.querySelector('#previewDownload').addEventListener('click',()=>downloadAsset(state.previewAsset));document.querySelector('#previewShare').addEventListener('click',()=>assetShare.hidden=false);document.querySelector('#assetShareCancel').addEventListener('click',()=>assetShare.hidden=true);assetShare.addEventListener('click',event=>{if(event.target===assetShare)assetShare.hidden=true});document.querySelectorAll('[data-asset-share]').forEach(button=>button.addEventListener('click',()=>{const target=button.dataset.assetShare;if(target==='copy'){navigator.clipboard?.writeText(location.href);showAssetToast('链接已复制')}else showAssetToast(`已打开${target}分享`);assetShare.hidden=true}));libraryPane.addEventListener('click',event=>{if(event.target.closest('.library-choice'))return;const card=event.target.closest('[data-asset-id]');if(!card)return;const asset=libraryItems.find(item=>item.id===card.dataset.assetId);if(asset)openAssetPreview(asset)});
      function renderFiltersV2(){const items=[['all','全部'],['video','视频'],['image','图片']];filters.innerHTML=`<div class="filter-options">${items.map(([id,label])=>`<button class="filter ${state.filter===id?'active':''}" data-filter-v2="${id}">${label}</button>`).join('')}</div>`;filters.querySelectorAll('[data-filter-v2]').forEach(button=>button.addEventListener('click',()=>{state.filter=button.dataset.filterV2;renderAssets()}))}
      function historyCard(entry){const generating=entry.status==='generating',video=entry.type==='video',selectable=entry.id!==previewGenerating.id,selected=state.selectedHistory.has(entry.id);return `<article class="creation-item ${generating?'generating':'completed'} ${selected?'selected':''}" data-creation-id="${escapeHTML(entry.id)}"><div class="creation-thumb ${generating?'generating':''} ${video?'video':''}"><img src="${escapeHTML(entry.asset)}" alt="${escapeHTML(entry.assetName||'创作结果')}">${generating?'<div class="making"><i></i><span>生成中</span></div>':video?'<span class="play"><svg viewBox="0 0 24 24" fill="currentColor"><path d="m8 5 11 7-11 7V5Z"/></svg></span>':''}</div><div class="creation-info"><div class="status-line"><span class="status-dot">${generating?'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 4v3M12 17v3M4 12h3M17 12h3"/></svg>':'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="m5 12 4.3 4.2L19 6.8"/></svg>'}</span>${generating?'生成中':'已完成'}</div><p class="prompt">${escapeHTML(entry.prompt)}</p></div><div class="creation-time"><time>${formatTime(entry.createdAt,entry.status)}</time>${selectable?`<button class="history-choice" type="button" data-history-select="${escapeHTML(entry.id)}" aria-label="选择此创作"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="m5 12 4.2 4.1L19 6.8"/></svg></button>`:''}</div></article>`}
      function renderHistoryV2(){const entries=[previewGenerating,...readHistory()].filter(entry=>state.filter==='all'||entry.type===state.filter);historyPane.innerHTML=entries.map(historyCard).join('');historyPane.querySelectorAll('[data-history-select]').forEach(button=>button.addEventListener('click',event=>{event.stopPropagation();const id=button.dataset.historySelect;state.selectedHistory.has(id)?state.selectedHistory.delete(id):state.selectedHistory.add(id);renderHistoryV2();renderBatchBar()}));renderBatchBar()}
      function renderLibraryV2(){const items=libraryItems.filter(asset=>state.filter==='all'||asset.type===state.filter);libraryPane.innerHTML=items.length?items.map(asset=>`<article class="library-card ${asset.type==='video'?'video':''} ${state.selectedAssets.has(asset.id)?'selected':''}" data-asset-id="${asset.id}"><div class="library-media"><img src="${asset.src}" alt="${asset.type==='video'?'视频':'图片'}素材"></div><span class="library-time">${formatTime(asset.createdAt||'2026-09-05T10:24:00',null)}</span><button class="library-choice" type="button" data-asset-select="${asset.id}" aria-label="选择素材"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="m5 12 4.2 4.1L19 6.8"/></svg></button></article>`).join(''):'<div class="empty" style="grid-column:1/-1"><div><strong>没有符合条件的资产</strong></div></div>';libraryPane.querySelectorAll('[data-asset-select]').forEach(button=>button.addEventListener('click',event=>{event.stopPropagation();const id=button.dataset.assetSelect;state.selectedAssets.has(id)?state.selectedAssets.delete(id):state.selectedAssets.add(id);renderLibraryV2();renderBatchBar()}));renderBatchBar()}
      function renderBatchBar(){const selected=state.tab==='history'?state.selectedHistory:state.selectedAssets;batchBar.hidden=!selected.size;document.querySelector('#batchDownload').hidden=state.tab==='history';document.querySelector('#batchDelete').textContent=`删除 ${selected.size} 项`}
      function renderAssets(){app.classList.toggle('showing-library',state.tab==='library');document.querySelectorAll('[data-tab]').forEach(button=>button.classList.toggle('active',button.dataset.tab===state.tab));historyPane.hidden=state.tab!=='history';libraryPane.hidden=state.tab!=='library';historyPane.style.display=state.tab==='history'?'':'none';libraryPane.style.display=state.tab==='library'?'':'none';if(state.tab==='history')libraryPane.replaceChildren();else historyPane.replaceChildren();renderFiltersV2();if(state.tab==='history')renderHistoryV2();else renderLibraryV2();renderBatchBar()}
      document.querySelectorAll('[data-tab]').forEach(button=>button.addEventListener('click',()=>{state.tab=button.dataset.tab;state.filter='all';state.selectedAssets.clear();state.selectedHistory.clear();renderAssets()}));document.querySelector('#batchCancel').addEventListener('click',()=>{state.selectedAssets.clear();state.selectedHistory.clear();renderAssets()});document.querySelector('#batchDownload').addEventListener('click',()=>{const chosen=libraryItems.filter(item=>state.selectedAssets.has(item.id));chosen.forEach(item=>downloadAsset(item));showAssetToast(`已开始下载 ${chosen.length} 个文件`)});document.querySelector('#batchDelete').addEventListener('click',()=>{const count=(state.tab==='history'?state.selectedHistory:state.selectedAssets).size;if(!count)return;document.querySelector('#deleteCopy').textContent=`将删除已选择的 ${count} 项内容，删除后无法恢复。`;deleteDialog.classList.add('show')});deleteDialog.querySelector('[data-delete-cancel]').addEventListener('click',()=>deleteDialog.classList.remove('show'));deleteDialog.addEventListener('click',event=>{if(event.target===deleteDialog)deleteDialog.classList.remove('show')});deleteDialog.querySelector('[data-delete-confirm]').addEventListener('click',()=>{if(state.tab==='history'){const remaining=readHistory().filter(entry=>!state.selectedHistory.has(entry.id));localStorage.setItem('maxai-creation-history',JSON.stringify(remaining));state.selectedHistory.clear();showAssetToast('已删除所选创作历史')}else{const count=state.selectedAssets.size;libraryItems=libraryItems.filter(item=>!state.selectedAssets.has(item.id));state.selectedAssets.clear();showAssetToast(`已移除 ${count} 个资产`)}deleteDialog.classList.remove('show');renderAssets()});window.addEventListener('storage',event=>{if(event.key==='maxai-creation-history'&&state.tab==='history')renderHistoryV2()});document.addEventListener('visibilitychange',()=>{if(!document.hidden&&state.tab==='history')renderHistoryV2()});renderAssets();
    })();

  <script>
    /* 所有历史项目可回到创作页；只有已完成作品显示发布入口。 */
    (()=>{
      const app=document.querySelector('.app');
      const dialog=document.createElement('div');
      dialog.className='publish-confirm';
      dialog.innerHTML='<section class="publish-confirm-card" role="dialog" aria-modal="true" aria-labelledby="publishTitle"><h2 id="publishTitle">分享为模板？</h2><p>发布后，其他创作者可查看并使用这份作品作为模板。你仍可在「我的 · 作品」中管理它。</p><div class="publish-confirm-actions"><button type="button" data-publish-cancel>取消</button><button type="button" class="confirm" data-publish-confirm>继续发布</button></div></section>';
      app.append(dialog);
      let selectedCreationId='';
      const historyEntries=()=>{try{return JSON.parse(localStorage.getItem('maxai-creation-history')||'[]')}catch(error){return []}};
      function decorateHistory(){
        const entries=historyEntries();
        [...historyPane.querySelectorAll('.creation-item.completed')].forEach(card=>{
          const entry=entries.find(item=>item.id===card.dataset.creationId);if(!entry||entry.origin!=='original')return;
          const time=card.querySelector('.creation-time');
          if(time&&!time.querySelector('.publish-work'))time.insertAdjacentHTML('beforeend','<button class="publish-work" type="button">发布作品</button>');
        });
      }
      new MutationObserver(decorateHistory).observe(historyPane,{childList:true});
      decorateHistory();
      historyPane.addEventListener('click',event=>{
        const card=event.target.closest('.creation-item[data-creation-id]');if(!card)return;
        const id=card.dataset.creationId;if(!id)return;
        if(event.target.closest('.publish-work')){event.stopPropagation();selectedCreationId=id;dialog.classList.add('show');return}
        location.href=`../create-v1/create-v1.html?creation=${encodeURIComponent(id)}`;
      });
      dialog.querySelector('[data-publish-cancel]').addEventListener('click',()=>dialog.classList.remove('show'));
      dialog.addEventListener('click',event=>{if(event.target===dialog)dialog.classList.remove('show')});
      dialog.querySelector('[data-publish-confirm]').addEventListener('click',()=>{if(selectedCreationId)location.href=`../publish-v1/publish-v1.html?creation=${encodeURIComponent(selectedCreationId)}`});
    })();
  </script>
