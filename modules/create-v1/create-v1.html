    function startAiPromptGeneration(){const source=state.attachment||state.uploaded[0],imageMode=state.mode==='image',idea=editor.innerText.trim(),subject=source?`参考图「${source.name}」`:'你的想法';let percent=0;aiPromptCard.innerHTML=`<div class="ai-prompt-badge">AI</div><h2 id="aiPromptTitle">正在完善提示词</h2><p>${imageMode?'识别商品特征并组织构图与视觉描述':'识别商品特征并组织镜头与卖点描述'}</p><div class="ai-prompt-progress"><i id="aiPromptProgressBar"></i></div><p class="ai-prompt-percent" id="aiPromptPercent">0%</p>`;const bar=document.querySelector('#aiPromptProgressBar'),label=document.querySelector('#aiPromptPercent'),started=Date.now();aiPromptProgressTimer=setInterval(()=>{percent=Math.min(96,Math.round((Date.now()-started)/3000*100));bar.style.width=`${percent}%`;label.textContent=`${percent}%`},80);aiPromptTimer=setTimeout(()=>{clearInterval(aiPromptProgressTimer);aiPromptProgressTimer=null;const prompt=imageMode?`以${subject}为主体，结合我的想法「${idea}」，制作一张高质感电商商品主视觉。采用简洁有层次的构图，以明亮暖橙色光影突出商品轮廓、材质细节与核心卖点，背景干净但富有空间感，整体呈现精致、可信赖的商业摄影质感，适合印尼社交媒体推广。`:`以${subject}为核心，结合我的想法「${idea}」，制作一支 9:16 电商爆款短视频。开场以动态光影突出商品轮廓，中段展示材质细节、使用场景与核心卖点，结尾用简洁有力的品牌画面收束。镜头衔接流畅，整体采用明亮暖橙色商业质感，适合印尼社交媒体投放。`;editor.textContent=prompt;state.range=null;updateAiPromptState();aiPromptCard.innerHTML='<div class="ai-prompt-done">✓</div><h2 id="aiPromptTitle">提示词已完善</h2><p>已将参考图和想法整理成专业提示词，你仍可继续编辑。</p>';showToast('AI 提示词已完善');aiPromptTimer=setTimeout(()=>{aiPromptDialog.hidden=true;editor.focus()},650)},3000)}

      function addLibraryAssets(){const stamp=Date.now(),added=[...editState.assetSelection].map((id,index)=>getMedia(id)).filter(asset=>asset&&asset.type!=='audio').map((asset,index)=>({id:`library-edit-${stamp}-${index}`,name:asset.name,src:asset.src,type:asset.type,visual:/\.(mp4|webm|mov)(?:[?#]|$)/i.test(asset.src)?'video':'image',duration:asset.type==='image'?3:5,objectUrl:false}));if(!added.length)return;const firstMaterial=!editState.clips.length;editState.clips.push(...added);if(firstMaterial)detectProjectRatio(added[0]);if(!editState.selected)editState.selected=added[0].id;editState.assetSelection.clear();renderTimeline();closeSheet();showToast(`已从资产库添加 ${added.length} 个素材`)}
      document.addEventListener('click',event=>{if(event.target.closest('[data-editor-add]')){openEditorAdd();return}const assetChoice=event.target.closest('[data-editor-asset]');if(assetChoice){const id=assetChoice.dataset.editorAsset;editState.assetSelection.has(id)?editState.assetSelection.delete(id):editState.assetSelection.add(id);renderEditorAssets();return}const clipButton=event.target.closest('[data-clip]');if(clipButton&&!event.target.closest('[data-trim]')){if(editState.suppressClick){editState.suppressClick=false;return}selectClip(clipButton.dataset.clip)}});
      input.addEventListener('change',event=>{addFiles(event.target.files);event.target.value=''});
      function beginReorder(clip,element,event){const rect=element.getBoundingClientRect(),ghost=element.cloneNode(true);ghost.classList.add('clip-drag-ghost');ghost.classList.remove('selected');ghost.querySelectorAll('.trim-handle').forEach(handle=>handle.remove());Object.assign(ghost.style,{left:`${rect.left}px`,top:`${rect.top}px`,width:`${rect.width}px`,height:`${rect.height}px`});document.body.appendChild(ghost);editState.selected=clip.id;editState.reorder={clip,ghost,offsetX:event.clientX-rect.left,lastX:event.clientX};editState.suppressClick=true;element.classList.add('reorder-source');deleteButton.hidden=false;navigator.vibrate?.(28)}
      function moveReorder(event){const order=editState.reorder;if(!order)return;order.lastX=event.clientX;order.ghost.style.left=`${event.clientX-order.offsetX}px`;const oldIndex=editState.clips.indexOf(order.clip),others=editState.clips.filter(clip=>clip!==order.clip),nodes=[...track.querySelectorAll('[data-clip]')].filter(node=>node.dataset.clip!==order.clip.id);let target=others.length;for(let index=0;index<nodes.length;index++){const rect=nodes[index].getBoundingClientRect();if(event.clientX<rect.left+rect.width/2){target=index;break}}if(target===oldIndex)return;const affected=oldIndex<target?editState.clips.slice(oldIndex+1,target+1):editState.clips.slice(target,oldIndex);editState.clips.splice(oldIndex,1);editState.clips.splice(target,0,order.clip);editState.reorderPulse={ids:affected.map(clip=>clip.id),direction:oldIndex<target?'left':'right',timer:null};renderTimeline()}
      function endReorder(cancelled=false){if(!editState.reorder)return;editState.reorder.ghost.remove();editState.reorder=null;editState.reorderPulse=null;renderTimeline();if(!cancelled)showToast('素材顺序已调整')}
      track.addEventListener('contextmenu',event=>event.preventDefault());track.addEventListener('pointerdown',event=>{const handle=event.target.closest('[data-trim]'),clipButton=event.target.closest('[data-clip]');if(!clipButton)return;const clip=editState.clips.find(item=>item.id===clipButton.dataset.clip);if(!clip)return;if(handle){event.preventDefault();editState.selected=clip.id;editState.drag={clip,startX:event.clientX,startDuration:clip.duration,side:handle.dataset.trim,scale:editState.pxPerSecond};return}editState.longPressStart={x:event.clientX,y:event.clientY};clearTimeout(editState.longPressTimer);editState.longPressTimer=setTimeout(()=>beginReorder(clip,clipButton,event),420)});
      document.addEventListener('pointermove',event=>{if(editState.scrubbing){event.preventDefault();seekFromClientX(event.clientX);return}if(editState.reorder){event.preventDefault();moveReorder(event);return}if(editState.drag){const delta=(event.clientX-editState.drag.startX)/editState.drag.scale,direction=editState.drag.side==='left'?-1:1;editState.drag.clip.duration=Math.min(300,Math.max(.5,editState.drag.startDuration+delta*direction));renderTimeline();return}if(editState.longPressStart&&Math.hypot(event.clientX-editState.longPressStart.x,event.clientY-editState.longPressStart.y)>8){clearTimeout(editState.longPressTimer);editState.longPressTimer=null;editState.longPressStart=null}});
      document.addEventListener('pointerup',()=>{clearTimeout(editState.longPressTimer);editState.longPressTimer=null;editState.longPressStart=null;if(editState.scrubbing){editState.scrubbing=false;playhead.classList.remove('scrubbing');return}if(editState.reorder){endReorder();return}if(editState.drag){showToast(`片段时长 ${editState.drag.clip.duration.toFixed(1)} 秒`);editState.drag=null}});document.addEventListener('pointercancel',()=>{clearTimeout(editState.longPressTimer);editState.longPressTimer=null;editState.longPressStart=null;if(editState.scrubbing){editState.scrubbing=false;playhead.classList.remove('scrubbing')}if(editState.reorder)endReorder(true)});
      function deleteSelected(){const clip=selectedClip();if(!clip)return;const index=editState.clips.indexOf(clip);editState.clips.splice(index,1);if(clip.objectUrl)URL.revokeObjectURL(clip.src);if(index===0)detectProjectRatio(editState.clips[0]||null);editState.selected=editState.clips[index]?.id||editState.clips[index-1]?.id||null;editState.previewed=null;deleteDialog.hidden=true;renderTimeline();showToast('片段已删除')}
      function startExport(){let progress=0;exportDialog.hidden=false;const card=document.querySelector('#exportDialogCard'),bar=document.querySelector('#exportProgressBar'),percent=document.querySelector('#exportPercent');card.innerHTML='<h2>正在导出</h2><p>请保持页面开启</p><div class="export-progress"><i id="exportProgressBar"></i></div><p class="export-percent" id="exportPercent">0%</p>';const activeBar=document.querySelector('#exportProgressBar'),activePercent=document.querySelector('#exportPercent'),timer=setInterval(()=>{progress=Math.min(100,progress+5);activeBar.style.width=`${progress}%`;activePercent.textContent=`${progress}%`;if(progress===100){clearInterval(timer);setTimeout(()=>{card.innerHTML='<div class="export-done">✓</div><h2>已保存到资产库</h2><p>可以前往资产页面查看导出的视频。</p><div class="editor-dialog-actions"><button class="danger" type="button" id="exportDone">完成</button></div>';document.querySelector('#exportDone').addEventListener('click',()=>exportDialog.hidden=true)},260)}},100)}
      playhead.addEventListener('pointerdown',event=>{event.preventDefault();event.stopPropagation();if(!editState.clips.length)return;editState.scrubbing=true;playhead.classList.add('scrubbing');seekFromClientX(event.clientX)});ruler.addEventListener('pointerdown',event=>{event.preventDefault();seekFromClientX(event.clientX)});playhead.addEventListener('keydown',event=>{if(!['ArrowLeft','ArrowRight'].includes(event.key)||!editState.clips.length)return;event.preventDefault();editState.current=Math.min(totalDuration(),Math.max(0,editState.current+(event.key==='ArrowRight'?0.5:-0.5)));const clip=clipAtTime(editState.current);if(clip)renderPreview(clip);updatePlayhead()});playButton.addEventListener('click',togglePlayback);deleteButton.addEventListener('click',()=>{if(selectedClip())deleteDialog.hidden=false});document.querySelector('#confirmClipDelete').addEventListener('click',deleteSelected);document.querySelectorAll('[data-editor-dialog-close]').forEach(button=>button.addEventListener('click',()=>button.closest('.editor-dialog').hidden=true));deleteDialog.addEventListener('click',event=>{if(event.target===deleteDialog)deleteDialog.hidden=true});document.querySelector('#editorOpenCamera').addEventListener('click',()=>document.querySelector('#editorCameraInput').click());document.querySelector('#editorOpenAlbum').addEventListener('click',()=>document.querySelector('#editorAlbumInput').click());document.querySelector('#editorShowAssets').addEventListener('click',()=>{editorAssetsPane.hidden=false;renderEditorAssets('all')});document.querySelectorAll('[data-editor-library-type]').forEach(button=>button.addEventListener('click',()=>renderEditorAssets(button.dataset.editorLibraryType)));editorAssetConfirm.addEventListener('click',addLibraryAssets);document.querySelector('#editorCameraInput').addEventListener('change',event=>{if(event.target.files.length)addFiles(event.target.files);event.target.value=''});document.querySelector('#editorAlbumInput').addEventListener('change',event=>{if(event.target.files.length)addFiles(event.target.files);event.target.value=''});exportButton.addEventListener('click',startExport);window.addEventListener('resize',renderTimeline);
      renderTimeline();
    })();
  </script>
  <script>
    /* 从创作历史恢复已完成或生成中的同一项目。 */
    (()=>{
      const creationId=new URLSearchParams(location.search).get('creation');
      if(!creationId)return;
      let entry;
      try{entry=(JSON.parse(localStorage.getItem('maxai-creation-history')||'[]')).find(item=>item.id===creationId)}catch(error){entry=null}
      if(!entry&&creationId==='preview-generating')entry={id:'preview-generating',status:'generating',type:'video',prompt:'暖调轻奢香水新品广告，突出暖白光影与产品质感。',asset:'../home-v1/assets/hero-perfume-v1.png',assetName:'正在生成的视频',model:'Seedance Mini'};
      if(!entry)return;
      const restoredAsset={id:`history-${entry.id}`,name:entry.assetName||'已生成作品',src:entry.asset};
      setMode(entry.type==='image'?'image':'video');
      state.model=entry.model||state.model;
      state.origin=entry.origin||'template-derived';
      if(entry.cta){state.cta={asset:{id:entry.cta.assetId||`cta-${entry.id}`,name:entry.cta.name||'CTA 图片',src:entry.cta.src,type:'image'},duration:Number(entry.cta.duration)||3};updateCtaButton()}
      document.querySelector('#modelLabel').textContent=state.model;
      editor.textContent=entry.prompt||'';
      setAttachment(restoredAsset);
      if(entry.status==='generating'){state.activeCreationId=entry.id==='preview-generating'?null:entry.id;renderGenerating();return}
      composer.classList.add('is-generating');
      state.generationFinished=true;
      generation.classList.add('show');
      const video=entry.type==='video';
      generation.innerHTML=`<article class="generation-card result"><div class="result-media ${video?'video':''}"><img src="${entry.asset}" alt="已完成作品"><button class="result-play" aria-label="播放生成视频"><svg viewBox="0 0 24 24" fill="currentColor"><path d="m8 5 11 7-11 7V5Z"/></svg></button>${ctaTailMarkup(video)}</div><div class="result-caption"><strong>${video?'视频已生成':'图片已生成'}</strong><span>已从创作历史恢复${video&&state.cta?` · 片尾 CTA ${state.cta.duration.toFixed(1)} 秒`:''}，可继续编辑并再次生成</span></div><div class="result-actions"><button class="result-action result-download" aria-label="下载作品"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v11M8 10l4 4 4-4M5 16v4h14v-4"/></svg></button><button class="result-action result-share" aria-label="转发作品"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3m0 0L7.5 7.5M12 3l4.5 4.5M5 13.5v5.2A2.3 2.3 0 0 0 7.3 21h9.4a2.3 2.3 0 0 0 2.3-2.3v-5.2"/></svg></button></div></article>`;
      generation.querySelector('.result-play')?.addEventListener('click',()=>showToast('正在播放生成视频'));
      generation.querySelector('.result-download').addEventListener('click',()=>downloadResult(restoredAsset));
      generation.querySelector('.result-share').addEventListener('click',openResultShare);
    })();
  </script>
