  <script>
    const assets=[{id:'perfume',name:'粉色香氛主图',src:'../home-v1/assets/hero-perfume-v1.png'},{id:'serum',name:'焕亮精华主图',src:'../home-v1/assets/hero-serum-v1.png'},{id:'sunglasses',name:'夏日眼镜主图',src:'../home-v1/assets/hero-sunglasses-v1.png'}];
    const libraryAssets=[...assets.map(asset=>({...asset,type:'image'})),{id:'perfume-video',name:'香氛成片.mp4',src:'../home-v1/assets/hero-perfume-v1.png',type:'video'},{id:'serum-video',name:'精华展示.mp4',src:'../home-v1/assets/hero-serum-v1.png',type:'video'},{id:'brand-audio',name:'品牌配乐.mp3',src:'../home-v1/assets/hero-sunglasses-v1.png',type:'audio'}];
    const templates={perfume:{mode:'video',prompt:'为粉色香氛制作高级感新品短片，轻盈光影与柔焦气泡环绕产品。',asset:'perfume'},serum:{mode:'video',prompt:'展示精华在暖白水波中的通透质感，强调焕亮与细腻的产品细节。',asset:'serum'},sunglasses:{mode:'image',prompt:'为夏日眼镜制作明亮高级的商品视觉，保留石材、阳光和蓝天氛围。',asset:'sunglasses'},luxury:{mode:'video',prompt:'制作轻奢新品电商视频，暖调光影突出商品质感与上新氛围。',asset:'perfume'},holiday:{mode:'image',prompt:'制作夏日度假风商品图，明亮自然光与舒适生活方式场景。',asset:'sunglasses'}};
    const state={mode:'video',model:'Seedance Mini',attachment:null,uploaded:[],addSelection:[],mentionSelection:null,mentionTab:'current',libraryType:'all',range:null,mentionTriggerRange:null,origin:'original',generationFinished:false,activeCreationId:null};
    const backdrop=document.querySelector('#backdrop'),sheets=[...document.querySelectorAll('.sheet')],editor=document.querySelector('#promptEditor'),toast=document.querySelector('.toast'),addGrid=document.querySelector('#addGrid'),mentionGrid=document.querySelector('#mentionGrid'),libraryGrid=document.querySelector('#libraryGrid'),generation=document.querySelector('#generation'),composer=document.querySelector('.composer');let toastTimer,generationTimer,progressTimer,tipTimer;
    function showToast(text){toast.textContent=text;toast.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.classList.remove('show'),1800)}
    function openSheet(id){backdrop.classList.add('show');sheets.forEach(sheet=>sheet.classList.toggle('active',sheet.id===id));if(id==='addSheet')renderGrid(addGrid,assets,'add');if(id==='mentionSheet')showMentionTab(state.mentionTab)}function closeSheet(){backdrop.classList.remove('show');sheets.forEach(sheet=>sheet.classList.remove('active'));state.mentionTriggerRange=null}
    function renderGrid(container,items,type){const selected=type==='add'?state.addSelection:state.mentionSelection;container.innerHTML=items.length?items.map(asset=>{const active=type==='add'?selected.includes(asset.id):selected===asset.id;return `<button class="asset-choice ${active?'selected':''}" data-select="${type}" data-id="${asset.id}"><img src="${asset.src}" alt="${asset.name}"><i></i><span>${asset.name}</span></button>`}).join(''):'<span style="grid-column:1/-1;color:#9a8e85;font-size:13px;padding:8px 0">暂未上传素材，可先通过加号添加</span>';document.querySelector(`#${type}Confirm`).disabled=type==='add'?!selected.length:!selected}
    function getAsset(id){return assets.find(asset=>asset.id===id)}function getMedia(id){return libraryAssets.find(asset=>asset.id===id)||getAsset(id)}function setMode(mode){state.mode=mode;state.model=mode==='video'?'Seedance Mini':'Seedream Pro';document.querySelector('#modelLabel').textContent=state.model;document.querySelectorAll('.mode-tab').forEach(tab=>tab.classList.toggle('active',tab.dataset.mode===mode));document.querySelectorAll('.model-card').forEach(card=>card.classList.toggle('selected',card.dataset.model===state.model))}
    function renderAttachments(){const container=document.querySelector('#attached');container.innerHTML=state.uploaded.map(asset=>`<span class="attachment-item" data-uploaded-id="${asset.id}"><img src="${asset.src}" alt="${asset.name}"><button class="attachment-remove" type="button" data-remove-attachment="${asset.id}" aria-label="移除 ${asset.name}">×</button></span>`).join('');container.classList.toggle('show',state.uploaded.length>0)}
    function setAttachment(asset){if(!asset)return;if(!state.uploaded.some(item=>item.id===asset.id))state.uploaded.push(asset);if(!state.attachment)state.attachment=asset;renderAttachments()}
    function removeAttachment(id){state.uploaded=state.uploaded.filter(asset=>asset.id!==id);if(state.attachment?.id===id)state.attachment=state.uploaded[0]||null;if(state.mentionSelection===id)state.mentionSelection=null;editor.querySelectorAll('.material-chip').forEach(chip=>{if(chip.dataset.assetId===id)chip.remove()});renderAttachments()}
    function showMentionTab(tab){state.mentionTab=tab;state.mentionSelection=null;document.querySelectorAll('[data-mention-tab]').forEach(button=>button.classList.toggle('active',button.dataset.mentionTab===tab));document.querySelector('#currentAssetsPane').hidden=tab!=='current';document.querySelector('#libraryAssetsPane').hidden=tab!=='library';if(tab==='current')renderGrid(mentionGrid,state.uploaded,'mention');else renderLibrary(state.libraryType)}function renderLibrary(type){state.libraryType=type;document.querySelectorAll('[data-library-type]').forEach(button=>button.classList.toggle('active',button.dataset.libraryType===type));renderGrid(libraryGrid,libraryAssets.filter(asset=>type==='all'||asset.type===type),'mention')}
    function saveRange(){const selection=window.getSelection();if(selection.rangeCount&&editor.contains(selection.anchorNode))state.range=selection.getRangeAt(0).cloneRange()}['keyup','mouseup','input'].forEach(event=>editor.addEventListener(event,saveRange));editor.addEventListener('focus',()=>{if(state.generationFinished){composer.classList.remove('is-generating');state.generationFinished=false}saveRange()});
    function openMentionFromTyping(event){if(event.isComposing||event.inputType!=='insertText'||event.data!=='@')return;const selection=window.getSelection();if(!selection.rangeCount)return;const caret=selection.getRangeAt(0).cloneRange(),node=caret.startContainer,offset=caret.startOffset;if(!caret.collapsed||node.nodeType!==Node.TEXT_NODE||offset<1||node.data.charAt(offset-1)!=='@')return;const trigger=caret.cloneRange();trigger.setStart(node,offset-1);state.mentionTriggerRange=trigger;state.range=caret;openSheet('mentionSheet')}
    editor.addEventListener('input',openMentionFromTyping);
    function insertChip(asset){editor.focus();const range=state.mentionTriggerRange||state.range||document.createRange();if(!state.mentionTriggerRange&&!state.range){range.selectNodeContents(editor);range.collapse(false)}range.deleteContents();state.mentionTriggerRange=null;const chip=document.createElement('span');chip.className='material-chip';chip.dataset.assetId=asset.id;chip.contentEditable='false';chip.innerHTML=`<img src="${asset.src}" alt=""><span>${asset.name}</span><button type="button" aria-label="移除 ${asset.name}">×</button>`;chip.querySelector('button').addEventListener('click',()=>chip.remove());range.insertNode(chip);const space=document.createTextNode(' ');chip.after(space);range.setStartAfter(space);range.collapse(true);const selection=window.getSelection();selection.removeAllRanges();selection.addRange(range);state.range=range.cloneRange()}
    document.querySelectorAll('[data-sheet]').forEach(button=>button.addEventListener('click',()=>{state.mentionTriggerRange=null;saveRange();openSheet(button.dataset.sheet)}));backdrop.addEventListener('click',event=>{if(event.target===backdrop)closeSheet()});
    document.addEventListener('click',event=>{const remove=event.target.closest('[data-remove-attachment]');if(remove){removeAttachment(remove.dataset.removeAttachment);return}const choice=event.target.closest('[data-select]');if(choice){const type=choice.dataset.select,id=choice.dataset.id;if(type==='add'){state.addSelection=state.addSelection.includes(id)?state.addSelection.filter(item=>item!==id):[...state.addSelection,id];renderGrid(addGrid,assets,'add')}else{state.mentionSelection=id;if(state.mentionTab==='library')renderLibrary(state.libraryType);else renderGrid(mentionGrid,state.uploaded,'mention')}}});
    document.querySelector('#addConfirm').addEventListener('click',()=>{const selected=state.addSelection.map(getAsset).filter(Boolean);selected.forEach(setAttachment);state.addSelection=[];closeSheet();showToast(`已添加 ${selected.length} 个素材`)});document.querySelector('#mentionConfirm').addEventListener('click',()=>{insertChip(getMedia(state.mentionSelection));state.mentionSelection=null;closeSheet();showToast('素材已引用')});
    function importFiles(fileList){const imported=[...fileList].map((file,index)=>({id:`upload-${Date.now()}-${index}`,name:file.name||`上传素材 ${index+1}`,src:URL.createObjectURL(file),type:'image'}));assets.push(...imported);imported.forEach(setAttachment);closeSheet();showToast(`已上传 ${imported.length} 个素材`)}
    document.querySelector('#openCamera').addEventListener('click',()=>document.querySelector('#cameraInput').click());document.querySelector('#openAlbum').addEventListener('click',()=>document.querySelector('#albumInput').click());document.querySelector('#cameraInput').addEventListener('change',event=>{if(event.target.files.length)importFiles(event.target.files);event.target.value=''});document.querySelector('#albumInput').addEventListener('change',event=>{if(event.target.files.length)importFiles(event.target.files);event.target.value=''});
    document.querySelectorAll('[data-toast]').forEach(button=>button.addEventListener('click',event=>{event.preventDefault();showToast(button.dataset.toast)}));document.querySelectorAll('[data-mode]').forEach(button=>button.addEventListener('click',()=>setMode(button.dataset.mode)));document.querySelectorAll('[data-mention-tab]').forEach(button=>button.addEventListener('click',()=>showMentionTab(button.dataset.mentionTab)));document.querySelectorAll('[data-library-type]').forEach(button=>button.addEventListener('click',()=>renderLibrary(button.dataset.libraryType)));document.querySelectorAll('[data-model]').forEach(button=>button.addEventListener('click',()=>{state.model=button.dataset.model;state.mode=button.dataset.kind;document.querySelector('#modelLabel').textContent=state.model;document.querySelectorAll('.model-card').forEach(card=>card.classList.toggle('selected',card===button));document.querySelectorAll('.mode-tab').forEach(tab=>tab.classList.toggle('active',tab.dataset.mode===state.mode));closeSheet()}));document.querySelectorAll('.ratio-option').forEach(button=>button.addEventListener('click',()=>{document.querySelector('#ratioButton').textContent=button.textContent.slice(0,4);closeSheet()}));
    document.querySelector('#back').addEventListener('click',()=>history.length>1?history.back():location.href='../home-v1/home-v1.html');
    const generationTips=['多角度商品图可帮助 AI 还原更多细节。','清晰的产品主体会让画面表现更稳定。','保持提示词聚焦，可获得更符合预期的成片。'];
    function readCreationHistory(){try{return JSON.parse(localStorage.getItem('maxai-creation-history')||'[]')}catch(error){return []}}
    function writeCreationHistory(history){try{localStorage.setItem('maxai-creation-history',JSON.stringify(history.slice(0,50)))}catch(error){/* 原型在限制存储的环境中仍可正常展示生成结果 */}}
    function saveGeneratingHistory(){const asset=generationAsset(),prompt=editor.innerText.trim().replace(/\s+/g,' '),entry={id:`creation-${Date.now()}`,status:'generating',origin:state.origin,type:state.mode,prompt:prompt||'未填写提示词',asset:asset.src,assetName:asset.name,model:state.model,createdAt:new Date().toISOString()};state.activeCreationId=entry.id;writeCreationHistory([entry,...readCreationHistory()])}
    function generationAsset(){return state.attachment||assets[state.mode==='image'?2:0]}
    function saveCreationHistory(asset){const history=readCreationHistory();if(state.activeCreationId){writeCreationHistory(history.map(entry=>entry.id===state.activeCreationId?{...entry,status:'complete',origin:entry.origin||state.origin}:entry));state.activeCreationId=null;return}const prompt=editor.innerText.trim().replace(/\s+/g,' '),entry={id:`creation-${Date.now()}`,status:'complete',origin:state.origin,type:state.mode,prompt:prompt||'未填写提示词',asset:asset.src,assetName:asset.name,model:state.model,createdAt:new Date().toISOString()};writeCreationHistory([entry,...history])}
    function renderResult(asset){clearInterval(progressTimer);clearInterval(tipTimer);state.generationFinished=true;saveCreationHistory(asset);const video=state.mode==='video';generation.innerHTML=`<article class="generation-card result"><div class="result-media ${video?'video':''}"><img src="${asset.src}" alt="生成结果"><button class="result-play" aria-label="播放生成视频"><svg viewBox="0 0 24 24" fill="currentColor"><path d="m8 5 11 7-11 7V5Z"/></svg></button></div><div class="result-caption"><strong>${video?'视频已生成':'图片已生成'}</strong><span>${video?'点击播放查看最终成片':'你的图片已准备完成'}</span></div></article>`;generation.querySelector('.result-play')?.addEventListener('click',()=>showToast('正在播放生成视频'));showToast(video?'视频生成成功':'图片生成成功')}
    function renderGenerating(){clearTimeout(generationTimer);clearInterval(progressTimer);clearInterval(tipTimer);state.generationFinished=false;composer.classList.add('is-generating');const asset=generationAsset();generation.classList.add('show');generation.innerHTML=`<article class="generation-card working"><div class="gen-bg" style="background-image:url('${asset.src}')"></div><div class="gen-shade"></div><div class="gen-content"><div class="gen-icon"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 7.5A2.5 2.5 0 0 1 6.5 5h7A2.5 2.5 0 0 1 16 7.5v1.1l2.8-1.7A1.5 1.5 0 0 1 21 8.2v7.6a1.5 1.5 0 0 1-2.2 1.3L16 15.4v1.1a2.5 2.5 0 0 1-2.5 2.5h-7A2.5 2.5 0 0 1 4 16.5v-9Z"/></svg></div><h2>正在生成${state.mode==='video'?'视频':'图片'}</h2><p>${state.mode==='video'?'正在将提示词转化为画面与镜头节奏':'正在把提示词转化为商品视觉'}</p><div class="loading-dots"><i></i><i></i><i></i></div></div><div class="progress-box"><div class="progress-meta"><span>预计还需不到 1 分钟</span><span id="progressNumber">12%</span></div><div class="progress-track"><div class="progress-bar" id="progressBar"></div></div></div><div class="tip-box"><div class="tip-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 18h6M10 21h4M8.2 14.6A6 6 0 1 1 15.8 14.6c-.9.7-1.3 1.5-1.4 2.4h-4.8c-.1-.9-.5-1.7-1.4-2.4Z"/></svg></div><div><strong>使用小贴士</strong><span id="tipText">${generationTips[0]}</span></div></div></article>`;let percent=12,tip=0;const bar=document.querySelector('#progressBar'),number=document.querySelector('#progressNumber'),tipText=document.querySelector('#tipText');progressTimer=setInterval(()=>{percent=Math.min(94,percent+Math.ceil(Math.random()*4));bar.style.width=`${percent}%`;number.textContent=`${percent}%`},330);tipTimer=setInterval(()=>{tip=(tip+1)%generationTips.length;tipText.textContent=generationTips[tip]},1450);generationTimer=setTimeout(()=>renderResult(asset),5000)}
    const shareBackdrop=document.querySelector('#shareBackdrop');
    function downloadResult(asset){const link=document.createElement('a');link.href=asset.src;link.download=`MaxAi-${state.mode==='video'?'video-cover':'image'}-${Date.now()}.png`;document.body.appendChild(link);link.click();link.remove();showToast('已保存到本地')}
    function openResultShare(){shareBackdrop.hidden=false}
    document.querySelectorAll('[data-share-app]').forEach(button=>button.addEventListener('click',()=>{const app=button.dataset.shareApp;if(app==='copy'){navigator.clipboard?.writeText(location.href);showToast('链接已复制')}else showToast(`已打开${app}分享`);shareBackdrop.hidden=true}));document.querySelector('#shareCancel').addEventListener('click',()=>shareBackdrop.hidden=true);shareBackdrop.addEventListener('click',event=>{if(event.target===shareBackdrop)shareBackdrop.hidden=true});
    function renderResult(asset){clearInterval(progressTimer);clearInterval(tipTimer);state.generationFinished=true;saveCreationHistory(asset);const video=state.mode==='video';generation.innerHTML=`<article class="generation-card result"><div class="result-media ${video?'video':''}"><img src="${asset.src}" alt="生成结果"><button class="result-play" aria-label="播放生成视频"><svg viewBox="0 0 24 24" fill="currentColor"><path d="m8 5 11 7-11 7V5Z"/></svg></button></div><div class="result-caption"><strong>${video?'视频已生成':'图片已生成'}</strong><span>${video?'点击播放查看最终成片':'你的图片已准备完成'}</span></div><div class="result-actions"><button class="result-action result-download" aria-label="下载作品"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v11M8 10l4 4 4-4M5 16v4h14v-4"/></svg></button><button class="result-action result-share" aria-label="转发作品"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3m0 0L7.5 7.5M12 3l4.5 4.5M5 13.5v5.2A2.3 2.3 0 0 0 7.3 21h9.4a2.3 2.3 0 0 0 2.3-2.3v-5.2"/></svg></button></div></article>`;generation.querySelector('.result-play')?.addEventListener('click',()=>showToast('正在播放生成视频'));generation.querySelector('.result-download').addEventListener('click',()=>downloadResult(asset));generation.querySelector('.result-share').addEventListener('click',openResultShare);showToast(video?'视频生成成功':'图片生成成功')}
    document.querySelector('#generate').addEventListener('click',()=>{if(localStorage.getItem('maxai-auth')!=='1'){location.href='../login-v1/login-v1.html?return='+encodeURIComponent(location.href);return}if(!localStorage.getItem('maxai-subscription')){location.href='../subscription-v1/subscription-v1.html?return='+encodeURIComponent(location.href);return}saveGeneratingHistory();renderGenerating()});
    document.querySelector('a[data-toast="资产页将在后续接入"]')?.addEventListener('click',()=>{location.href='../assets-v1/assets-v1.html'});const profileNav=document.querySelector('a[data-toast="我的页面将在后续接入"]');if(profileNav){profileNav.removeAttribute('data-toast');profileNav.href='../mine-v1/mine-v1.html'}
    const query=new URLSearchParams(location.search),template=templates[query.get('template')];if(template){state.origin='template-derived';setMode(query.get('mode')==='image'?'image':template.mode);editor.textContent=template.prompt;setAttachment(getAsset(template.asset))}else setMode(query.get('mode')==='image'?'image':'video');
    const inspirations=[['perfume','香氛质感'],['serum','焕亮精华'],['sunglasses','夏日眼镜'],['luxury','轻奢上新']];document.querySelector('#ideaRail').innerHTML=inspirations.map(([key,name])=>{const item=templates[key]||templates.perfume;return `<a class="idea" href="../template-detail-v1/template-detail-v1.html?template=${key}"><div class="idea-media"><img src="${getAsset(item.asset).src}" alt="${name}"><strong>${name}</strong></div><small>热门模板</small></a>`}).join('');
  </script>
  <script>
    /* 从创作历史恢复已完成或生成中的同一项目。 */
    (()=>{
      const creationId=new URLSearchParams(location.search).get('creation');
      if(!creationId)return;
      let entry;
      try{entry=(JSON.parse(localStorage.getItem('maxai-creation-history')||'[]')).find(item=>item.id===creationId)}catch(error){entry=null}
      if(!entry&&creationId==='preview-generating')entry={id:'preview-generating',status:'generating',type:'video',prompt:'暖调轻奢香水新品广告，突出暖白光影与产品质感。',asset:'../home-v1/assets/hero-perfume-v1.png',assetName:'正在生成的视频',model:'Seedance Mini'};
      if(!entry)return;
      const restoredAsset={id:`history-${entry.id}`,name:entry.assetName||'已生成作品',src:entry.asset};
      setMode(entry.type==='image'?'image':'video');
      state.model=entry.model||state.model;
      state.origin=entry.origin||'template-derived';
      document.querySelector('#modelLabel').textContent=state.model;
      editor.textContent=entry.prompt||'';
      setAttachment(restoredAsset);
      if(entry.status==='generating'){state.activeCreationId=entry.id==='preview-generating'?null:entry.id;renderGenerating();return}
      composer.classList.add('is-generating');
      state.generationFinished=true;
      generation.classList.add('show');
      const video=entry.type==='video';
      generation.innerHTML=`<article class="generation-card result"><div class="result-media ${video?'video':''}"><img src="${entry.asset}" alt="已完成作品"><button class="result-play" aria-label="播放生成视频"><svg viewBox="0 0 24 24" fill="currentColor"><path d="m8 5 11 7-11 7V5Z"/></svg></button></div><div class="result-caption"><strong>${video?'视频已生成':'图片已生成'}</strong><span>已从创作历史恢复，可继续编辑并再次生成</span></div><div class="result-actions"><button class="result-action result-download" aria-label="下载作品"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v11M8 10l4 4 4-4M5 16v4h14v-4"/></svg></button><button class="result-action result-share" aria-label="转发作品"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3m0 0L7.5 7.5M12 3l4.5 4.5M5 13.5v5.2A2.3 2.3 0 0 0 7.3 21h9.4a2.3 2.3 0 0 0 2.3-2.3v-5.2"/></svg></button></div></article>`;
      generation.querySelector('.result-play')?.addEventListener('click',()=>showToast('正在播放生成视频'));
      generation.querySelector('.result-download').addEventListener('click',()=>downloadResult(restoredAsset));
      generation.querySelector('.result-share').addEventListener('click',openResultShare);
    })();
  </script>
<script>
  (()=>{const button=document.querySelector('.tool.round[data-sheet="addSheet"]');if(button)button.innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M12 6.5v11M6.5 12h11"/></svg>'})();
</script>
